<!-- @dsCard group="Feedback" height=365 -->
<div id="root" style="padding: 24px; font-family: var(--font-sans); color: var(--ink-primary);"></div>
<script>
  const h = React.createElement;
  const R = window.Redrob;
  const row = (kids, extra) => h('div', { style: Object.assign({ display: 'flex', gap: '16px', alignItems: 'center', flexWrap: 'wrap' }, extra) }, kids);
  const col = (kids, extra) => h('div', { style: Object.assign({ display: 'flex', flexDirection: 'column', gap: '16px' }, extra) }, kids);

  function Demo() {
    const [open, setOpen] = React.useState(true);
    /* Something has to be behind the scrim. A drawer over an empty ground is a
       gray rectangle with a dialog on it, which is not what a drawer looks like. */
    const behind = h('div', { key: 'bg', style: { position: 'absolute', inset: 0, padding: '20px 24px', display: 'flex', flexDirection: 'column', gap: '10px' } },
      [['Aarav Sharma', 'Backend Engineer', 'Noida', '92%'],
       ['Ji-woo Park', 'Product Designer', 'Seoul', '88%'],
       ['Meera Nair', 'Data Analyst', 'Noida', '74%'],
       ['Daniel Okafor', 'Backend Engineer', 'Lagos', '69%'],
       ['Sofia Bianchi', 'Product Designer', 'Remote', '61%']].map((r, i) =>
        h('div', { key: i, style: { display: 'grid', gridTemplateColumns: '1.3fr 1.2fr 1fr auto', gap: '12px', alignItems: 'center', fontSize: '13px', color: 'var(--ink-secondary)', paddingBottom: '10px', borderBottom: '1px solid var(--border-subtle)' } },
          [h('span', { key: 'a', style: { color: 'var(--ink-primary)', fontWeight: 600 } }, r[0]),
           h('span', { key: 'b' }, r[1]), h('span', { key: 'c' }, r[2]),
           h('span', { key: 'd', style: { fontVariantNumeric: 'tabular-nums' } }, r[3])])));
    return h('div', { style: { position: 'relative', height: '304px', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-lg)', background: 'var(--surface-base)', overflow: 'hidden' } }, [
      behind,
      open && h(R.Drawer, {
        key: 'd',
        title: 'Aarav Sharma',
        description: 'Backend Engineer - Noida',
        onClose: () => setOpen(false),
        footer: [
          h(R.Button, { key: 1, variant: 'secondary', onClick: () => setOpen(false) }, 'Close'),
          h(R.Button, { key: 2 }, 'Move to interview'),
        ],
      }, col([
        h('p', { key: 1, style: { margin: 0 } }, 'Seven years on payment infrastructure, most recently leading a team of four. Available from March.'),
        h(R.Badge, { key: 2, tone: 'info' }, 'Interview'),
      ], { gap: '12px' })),
    ]);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
