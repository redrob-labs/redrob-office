<!-- @dsCard group="Agent chat" height=630 -->
<div id="root" style="padding: 32px; font-family: var(--font-sans); color: var(--ink-primary);"></div>
<script>
  const h = React.createElement;
  const R = window.Redrob;
  const I = R.icons;
  const ic = (n, s) => h(I[n], { width: s || 15, height: s || 15 });

  const PRIVACY = h(R.PrivacyProtection, { level: 'high', summary: '214 private details kept from AI this week.',
    last: ['Your last message: 3 details kept private. ', h('a', { key: 'a', href: '#what-the-ai-saw' }, 'See what the AI saw')],
    foot: [h('span', { key: 'a' }, 'Set to High for your whole team by your admin, Park Hyunjin.'), h('a', { key: 'b', href: '#privacy' }, 'How it works')] });
  const MEMORY = (value, onChange) => h(R.MemoryScope, { value, onChange,
    options: [
      { value: 'project', label: 'This project', detail: '12 notes about Seorin MSA', summary: '12 notes, kept by Redrob outside any AI, so they work with every model.' },
      { value: 'all', label: 'All my work', detail: 'Also 31 notes on how you like to work', summary: '43 notes, kept by Redrob outside any AI, so they work with every model.' },
      { value: 'none', label: 'Off for this chat', detail: 'Nothing is read, and nothing is saved', off: true }
    ],
    foot: [h('span', { key: 'a' }, 'Yours to keep: download every note at any time.'), h('a', { key: 'b', href: '#memory' }, 'Open Memory')] });
  const CHECK = (value, onChange) => h(R.CrossCheckSetting, { value, onChange,
    foot: [h('span', { key: 'a' }, 'Every check says which AI ran it.'), h('a', { key: 'b', href: '#cross-check' }, 'See how a check reads')] });

  function statusItems(mem, setMem, op, setOp, web) {
    return [
      web
        ? { id: 'privacy', icon: ic('shield'), tone: 'warn', name: 'Privacy', value: 'Off on the web',
            panel: h(R.PrivacyProtection, { state: 'off', foot: [h('span', { key: 'a' }, 'On Strict, your admin can stop sending from the web altogether.'), h('a', { key: 'b', href: '#privacy' }, 'How it works')] }) }
        : { id: 'privacy', icon: ic('shieldCheck'), tone: 'safe', name: 'Privacy', value: 'High', level: { n: 2, of: 3 }, live: 'Running on this laptop', panel: PRIVACY },
      { id: 'memory', icon: ic('bookOpen'), tone: mem === 'none' ? 'plain' : 'on', name: 'Memory', value: mem === 'none' ? 'Off' : 'On for every AI', panel: MEMORY(mem, setMem) },
      { id: 'check', icon: ic('compare'), tone: op.factCheck === 'off' && op.challenge === 'off' ? 'plain' : 'on', name: 'Cross-check', value: R.CrossCheckSetting.value(op), panel: CHECK(op, setOp) }
    ];
  }

  function Demo() {
    const [mem, setMem] = React.useState('project');
    const [op, setOp] = React.useState({ factCheck: 'auto', challenge: 'auto' });
    const [web, setWeb] = React.useState(false);
    return h('div', { style: { maxWidth: '760px', minHeight: '560px', display: 'flex', flexDirection: 'column', justifyContent: 'flex-end', gap: '16px' } }, [
      h(R.Composer, { key: 'c', defaultValue: 'Send Kim Minjun a short update on where we are',
        context: h('span', { className: 'rr-composer__chip' }, [ic('folder', 14), h('span', { key: 't' }, 'Seorin MSA')]),
        status: h(R.ComposerStatus, { items: statusItems(mem, setMem, op, setOp, web), defaultOpen: 'privacy' }) }),
      h('div', { key: 'x', style: { display: 'flex', gap: '8px', alignItems: 'center', fontSize: '12px', color: 'var(--ink-secondary)' } }, [
        h('span', { key: 't' }, 'Where the chat is open:'),
        h(R.Button, { key: 'd', size: 'sm', variant: web ? 'ghost' : 'secondary', onClick: () => setWeb(false) }, 'Desktop app'),
        h(R.Button, { key: 'w', size: 'sm', variant: web ? 'secondary' : 'ghost', onClick: () => setWeb(true) }, 'Web')
      ])
    ]);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
