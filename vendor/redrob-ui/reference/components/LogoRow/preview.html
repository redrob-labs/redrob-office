<!-- @dsCard group="Marketing" height=560 width=1180 -->
<div id="root" style="font-family: var(--font-sans); color: var(--ink-primary);"></div>
<script>
  const h = React.createElement;
  const R = window.Redrob;

  /* Redrob's confirmed wall, in the order and at the scales recorded in
     assets/Customers/README.md. Each organization's own file, permission on file. */
  const LOGOS = [
    { name:'Hanwha',                              src:'/_blob/b35ae2bd0b84e1fd4181a0ff0cae216d', scale:1.1 },
    { name:'University of California, Riverside', src:'/_blob/f3a5a4c93e88ca69b04def8dface0de4', scale:1.3 },
    { name:'LG',                                  src:'/_blob/e9c270336e1656fc9a6c0b6c426ade5a' },
    { name:'Binghamton University',               src:'/_blob/fd9dc179f6fdc023c3e267babac9afec' },
    { name:'Hyundai Motor Group',                 src:'/_blob/c90764cd368065bfd398a65d41e6a7eb', scale:1.1 },
  ];

  /* No sentence: the marks stand alone. Light ground, then the same row on deep (inverted). */
  function Demo() {
    return h('div', null, [
      h(R.Band, { key:'l', size:'sm' }, h(R.LogoRow, { logos: LOGOS })),
      h(R.Band, { key:'d', size:'sm', ground:'deep' }, h(R.LogoRow, { logos: LOGOS }))
    ]);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
