<!-- @dsCard group="Agent chat" height=360 -->
<div id="root" style="padding: 24px; font-family: var(--font-sans); color: var(--ink-primary);"></div>
<script>
  const h = React.createElement;
  const R = window.Redrob;
  const I = R.icons;
  const PROFESSIONS = [ { id:'lawyer', label:'Lawyer', tasks:[ { id:'review', label:'Review contracts', title:'Top 5 for a lawyer reviewing contracts', picks:[
    { id:'r-1', model:'Claude Opus 5.5', short:'Opus 5.5', harness:'Redrob Cowork', effort:{ label:'High', level:3, of:5 },
      why:'Reads the whole folder, clause by clause, and quotes rather than summarizes.' } ] } ] } ];
  const label = (t) => h('div', { style: { fontSize: '12px', fontWeight: 600, color: 'var(--ink-secondary)', margin: '0 0 8px' } }, t);

  function Demo() {
    const [mode, setMode] = React.useState('plan');
    const tools = (k, m, set) => h('span', { key: k, style: { display: 'inline-flex', alignItems: 'center', gap: '4px' } }, [
      h(R.ComposerMode, { key: 'm', value: m, onChange: set }),
      h(R.ModelPicker, { key: 'p', professions: PROFESSIONS, placement: 'top', align: 'end' })]);
    return h('div', { style: { maxWidth: '720px', display: 'flex', flexDirection: 'column', gap: '24px' } }, [
      h('div', { key: 1 }, [label(mode === 'plan' ? 'Plan: Cowork asks, then writes a plan. Nothing runs until you say so.' : 'Run: Cowork starts at once'),
        h(R.Composer, { key: 'c', defaultValue: 'Can we end the Seorin MSA by email next week? We want out by the end of November.',
          context: h('span', { className: 'rr-composer__chip' }, [h(I.folder, { key: 'i', width: 14, height: 14 }), h('span', { key: 't' }, 'Seorin MSA')]),
          tools: tools('a', mode, setMode) })]),
      h('div', { key: 2 }, [label('On its own, and compact, as on a phone'),
        h('div', { key: 'r', style: { display: 'flex', gap: '16px', alignItems: 'center' } }, [
          h(R.ComposerMode, { key: 'a', value: mode, onChange: setMode }),
          h(R.ComposerMode, { key: 'b', value: mode, onChange: setMode, compact: true })])])
    ]);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
