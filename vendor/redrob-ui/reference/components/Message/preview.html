<div id="root" style="padding: 24px; font-family: var(--font-sans); color: var(--ink-primary);"></div>
<script>
  const h = React.createElement;
  const R = window.Redrob;
  const row = (kids, extra) => h('div', { style: Object.assign({ display: 'flex', gap: '16px', alignItems: 'center', flexWrap: 'wrap' }, extra) }, kids);
  const col = (kids, extra) => h('div', { style: Object.assign({ display: 'flex', flexDirection: 'column', gap: '16px' }, extra) }, kids);

  function Demo() {
    return col([
      h(R.Message, { key: 1, role: 'user', author: 'Felix Kim' }, 'Which of the Noida backend candidates have payments experience?'),
      h(R.Message, { key: 2, role: 'assistant', footer: [
        h(R.Citation, { key: 1, index: 1, source: 'Aarav Sharma - CV', href: '/records/aarav-sharma-cv' }),
        h(R.Citation, { key: 2, index: 2, source: 'Screening call notes', href: '/records/screening-call-notes' }),
        h(R.Confidence, { key: 3, level: 'high', note: 'both sources are first-hand' }),
      ] }, 'Three of the twelve. Aarav Sharma led a payments platform team for four years, Meera Nair worked on settlement reconciliation, and Rohit Verma spent two years on a UPI integration.'),
    ], { gap: '20px' });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
