ook data breaches outside the limit. Hurts a supplier.\n3. [Appellate court, 2023, ref. withheld]\n   Gross negligence read narrowly: repeated warnings ignored, not a single oversight.\n\nTwo more below, and the two sources seen only in summary are listed at the end.","illustrative":true},"runHref":"#","efforts":[{"label":"Instant","level":1,"of":2,"monthly":7.3,"place":6},{"label":"Thinking","level":2,"of":2,"monthly":14.6,"place":1}]},{"id":"research-2","model":"Claude Opus 5.5","short":"Opus 5.5","harness":"Redrob Cowork","effort":{"label":"Extra high","level":4,"of":5},"why":"Searches, reads the cases in full and sets out what each one held, with where it came from.","monthly":58.4,"score":{"quality":88,"reliability":92,"speed":85.8,"cost":50.0,"ci":1.5},"measured":{"quality":"rubric 8.8 / 10 (experts 8.9, judges 8.6)","reliability":"92 of 100 runs passed","speed":"median 9.5 min a task","cost":"$58 a month"},"facts":[["Model ID","claude-opus-5-5"],["Effort setting","effort: \"xhigh\""],["Harness","Redrob Cowork"],["Runs","20 prompts x 5 runs"],["Tokens a task","400k in, 30k out, x2.2 at Extra high effort"],["Price per 1M tokens","$4 in, $20 out"],["Graders","2 lawyers, 3 model judges"],["Judge agreement","kappa 0.74"]],"note":"Read every decision in full and marked the one it could only find in summary.","sample":{"output":"Six decisions, newest first. Case references are placeholders in this sample.\n\n1. [Appellate court, 2024, ref. withheld]\n   A clause of 30% of the contract value was reduced to 10%. The buyer's actual loss was modest and foreseeable at signing, so the court treated the excess as a penalty. Hurts a supplier seeking the full amount.\n2. [Appellate court, 2022, ref. withheld]\n   Reduced from 20% to 12%. The court weighed the supplier's bargaining position and the fact that the delay caused no loss for the first two months. Hurts.\n3. [Appellate court, 2021, ref. withheld]\n   Reduction refused. Both parties were large companies advised by counsel, and the amount had been negotiated down from the first draft. Helps.\n4. [Appellate court, 2019, ref. withheld]\n   Reduced where the clause applied the same amount to a minor and a major breach. Hurts, unless the clause is tiered.\n5. [Appellate court, 2018, ref. withheld]\n   Reduction refused; the court held that hindsight about the actual loss is not the test. Helps.\n6. [Appellate court, 2016, ref. withheld]\n   Partly reduced; the court kept the amount for the first month of delay and cut it after. Mixed.\n\nPattern: courts ask whether the amount was a genuine pre-estimate at signing, and look hard at one-size clauses. One decision (4) was available only as a summary; the rest were read in full.","illustrative":true},"runHref":"#","efforts":[{"label":"Low","level":1,"of":5,"monthly":17.52},{"label":"Medium","level":2,"of":5,"monthly":27.25},{"label":"High","level":3,"of":5,"monthly":38.93,"place":7},{"label":"Extra high","level":4,"of":5,"monthly":58.4,"place":2},{"label":"Max","level":5,"of":5,"monthly":97.33,"place":8}]},{"id":"research-3","model":"Claude Fable 5.1","short":"Fable 5.1","harness":"Claude Research","effort":{"label":"Extra high","level":4,"of":5},"why":"Among the top scores on public legal research tests. Stronger on the hardest questions, at over twice the price.","monthly":146.0,"score":{"quality":90,"reliability":93,"speed":76.4,"cost":31.6,"ci":1.8},"measured":{"quality":"rubric 9.0 / 10 (experts 9.2, judges 8.8)","reliability":"93 of 100 runs passed","speed":"median 12.0 min a task","cost":"$146 a month"},"facts":[["Model ID","claude-fable-5-1"],["Effort setting","effort: \"xhigh\""],["Harness","Claude Research"],["Runs","20 prompts x 5 runs"],["Tokens a task","400k in, 30k out, x2.2 at Extra high effort"],["Price per 1M tokens","$10 in, $50 out"],["Graders","2 lawyers, 3 model judges"],["Judge agreement","kappa 0.72"]],"note":"Found one more decision than the top pick, at over twice the price.","sample":{"output":"Seven decisions 12 out"],["Graders","2 lawyers, 3 model judges"],["Judge agreement","kappa 0.70"]],"note":"Broad and well sourced, but mixed two jurisdictions without saying so.","sample":{"output":"Found 9 relevant results.\n\nSummary of the leading approach: courts may reduce a liquidated damages clause where the amount is disproportionate to the loss the parties could anticipate. Factors cited include the parties' relative bargaining power, whether the amount was negotiated, the nature of the breach, and the actual loss suffered.\n\nDecisions (references withheld in this sample)\n- 2024: reduced from 30% to 10%.\n- 2022: reduced from 20% to 12%.\n- 2021: reduction refused, negotiated clause.\n- 2019: reduced, single sum for any breach.\n- 2018: refused, hindsight not the test.\n- 2017: reduced (commercial lease).\n- 2016: partly reduced.\n- 2015: refused.\n- 2015: reduced (consumer contract).\n\nSources: 9 linked.","illustrative":true},"runHref":"#","efforts":[{"label":"Low","level":1,"of":3,"monthly":10.05},{"label":"Medium","level":2,"of":3,"monthly":16.75,"place":11},{"label":"High","level":3,"of":3,"monthly":26.8,"place":4}]},{"id":"research-5","model":"GPT-6 Astra","short":"GPT-6 Astra","harness":"ChatGPT Work","effort":{"label":"Extra High","level":4,"of":5},"why":"OpenAI's largest model, for a hard question checked from another side.","monthly":146.0,"score":{"quality":85,"reliability":84,"speed":70.7,"cost":31.6,"ci":2.4},"measured":{"quality":"rubric 8.5 / 10 (experts 8.7, judges 8.3)","reliability":"84 of 100 runs passed","speed":"median 14.0 min a task","cost":"$146 a month"},"facts":[["Model ID","gpt-6-astra"],["Effort setting","reasoning.effort: \"xhigh\""],["Harness","ChatGPT Work"],["Runs","20 prompts x 5 runs"],["Tokens a task","400k in, 30k out, x2.2 at Extra High effort"],["Price per 1M tokens","$10 in, $50 out"],["Graders","2 lawyers, 3 model judges"],["Judge agreement","kappa 0.68"]],"note":"Careful analysis; slower, and one reference could not be traced.","sample":{"output":"Five decisions, each with a helps/hurts note for the supplier. References are placeholders in this sample.\n\n1. [2024] Reduced to a third of the stated sum. HURTS. The court relied on the gap between the clause and the foreseeable loss.\n2. [2021] Reduction refused. HELPS. Negotiated clause between two represented companies; bargaining power was treated as decisive.\n3. [2019] Reduced. HURTS. A single sum for every breach was treated as a penalty.\n4. [2018] Refused. HELPS. The court declined to use actual loss with hindsight.\n5. [2016] Partly reduced. MIXED.\n\nTwo of the five turn on bargaining power, which favors the supplier here: the agreement was negotiated over three drafts with counsel on both sides. The tiered structure of §12 also answers the risk in decision 3.","illustrative":true},"runHref":"#","efforts":[{"label":"Instant","level":1,"of":5,"monthly":29.2},{"label":"Medium","level":2,"of":5,"monthly":68.13},{"label":"High","level":3,"of":5,"monthly":97.33,"place":12},{"label":"Extra High","level":4,"of":5,"monthly":146.0,"place":5},{"label":"Pro","level":5,"of":5,"monthly":389.33,"place":13}]}]},{"id":"memo","label":"Write briefs and memos","title":"Top 5 for a lawyer writing briefs and memos","usage":"Priced for about 10 briefs or memos a month.","basis":"Priced for about 10 briefs or memos a month","prompt":"Draft a two-page memo to the client on whether they can end the Seorin supply agreement early for convenience. Use the research in the Research folder and the contract itself. Lead with the answer.","weights":{"quality":0.6,"reliability":0.2,"speed":0.05,"cost":0.15},"formula":"Score = 0.60 Quality + 0.20 Reliability + 0.05 Speed + 0.15 Cost. Speed = 100 x sqrt(fastest median / this median). Cost = 100 x sqrt(cheapest month / this month).","picks":[{"id":"memo-1","model":"GPT-6 Astra","short":"GPT-6 Astra","harness":"Redrob Cowork","effort":{"label":"High","level":3,"of":5},"why":"Writes a tight memo from the whole record, and states the weak points of our own position.","monthly":24.0,"score":{"quality":95,"reliability":96,"speed":59.2,"cost":61.2,"ci":1.2},"measured":{"quality":"rubric 9.5 / 10 (experts 9.6, judges 9.3)","reliability":"96 of 100 runs passed","speed":"median 10.0 min a task","cost":"$24 a month"},"facts":[["Model ID","gpt-6-astra"],["Effort setting","reasoning.effort: \"high\""],["Harness","Redrob Cowork"],["Runs","20 prompts x 5 runs"],["Tokens a task","250k in, 40k out, x1.5 at High effort"],["Price per 1M tokens","$10 in, $50 out"],["Graders","2 lawyers, 3 model judges"],["Judge agreement","kappa 0.76"]],"note":"Put the strongest argument against our position on page one, as the rubric asks.","sample":{"output":"MEMO\nTo: Litigation team\nRe: Limit of liability in the Seorin agreement\n\n1. Question\nDoes the 12-month limit in Clause 11.4 cover a data breach?\n\n2. Short answer\nProbably not. The exception in 11.4(c) names \"any breach of Clause 13 (Data)\".\n\n3. The weak point in our position\nIf 11.4(c) is read as limited to gross negligence, ordinary breaches stay under the limit. Two appellate decisions support that reading.","illustrative":true},"runHref":"#","efforts":[{"label":"Instant","level":1,"of":5,"monthly":7.2},{"label":"Medium","level":2,"of":5,"monthly":16.8,"place":6},{"label":"High","level":3,"of":5,"monthly":24.0,"place":1},{"label":"Extra High","level":4,"of":5,"monthly":36.0,"place":7}]},{"id":"memo-2","model":"Claude Opus 5.5","short":"Opus 5.5","harness":"Redrob Cowork","effort":{"label":"High","level":3,"of":5},"why":"Writes long, structured argument from the research already in your folder.","monthly":22.0,"score":{"quality":90,"reliability":95,"speed":76.4,"cost":64.0,"ci":1.5},"measured":{"quality":"rubric 9.0 / 10 (experts 9.2, judges 8.8)","reliability":"95 of 100 runs passed","speed":"median 6.0 min a task","cost":"$22 a month"},"facts":[["Model ID","claude-opus-5-5"],["Effort setting","effort: \"high\""],["Harness","Redrob Cowork"],["Runs","20 prompts x 5 runs"],["Tokens a task","250k in, 40k out, x1.5 at High effort"],["Price per 1M tokens","$4 in, $20 out"],["Graders","2 lawyers, 3 model judges"],["Judge agreement","kappa 0.74"]],"note":"Led with the answer, cited the contract and the research folder for every step.","sample":{"output":"MEMORANDUM\n\nTo: Min-ji Park, General Counsel\nFrom: [Firm]\nRe: Ending the Seorin supply agreement early\nDate: 24 September 2026\n\nShort answer\nYes. The agreement can be ended for convenience under §18.2 on 90 days' written notice, with a break fee of 15% of the fees remaining for the Term. The break fee is likely to be enforced as written.\n\n1. What the contract says\n§18.2 allows either party to end the agreement for convenience on 90 days' written notice. §18.3 sets the break fee at 15% of the fees that would have been payable for the rest of the Term. On current figures that is about KRW 189m if notice is given on 1 October.\n\n2. Why the break fee is likely to stand\nThe fee was negotiated over three drafts between two companies with counsel (drafts in the Research folder). The decisions collected in the Research folder treat negotiation between sophisticated parties as the strongest reason not to reduce an agreed sum. The fee is also tiered by the time remaining, which answers the main ground on which courts have reduced such clauses.\n\n3. Risks\n- Seorin may argue that notice given before the 12-month mark breaches §18.2(b). The clause does not say so, but the point should be addressed in the notice.\n- Work in progress: §18.5 requires payment for work completed to the date of termination.\n\n4. Recommendation\nGive notice under §18.2 on or after 1 October, state the break fee and the work-in-progress figure, and propose a handover plan. A draft notice is attached.","illustrative":true},"runHref":"#","efforts":[{"label":"Low","level":1,"of":5,"monthly":9.9},{"label":"Medium","level":2,"of":5,"monthly":15.4,"place":8},{"label":"High","level":3,"of":5,"monthly":22.0,"place":2},{"label":"Extra high","level":4,"of":5,"monthly":33.0,"place":9},{"label":"Max","level":5,"of":5,"monthly":55.0}]},{"id":"memo-3","model":"Gemini 3.1 Pro","short":"Gemini 3.1 Pro","harness":"Gemini Enterprise for Legal","effort":{"label":"High","level":3,"of":3},"why":"Built to check the citations in a brief against their sources.","monthly":12.2,"score":{"quality":83,"reliability":88,"speed":73.4,"cost":85.9,"ci":1.8},"measured":{"quality":"rubric 8.3 / 10 (experts 8.4, judges 8.1)","reliability":"88 of 100 runs passed","speed":"median 6.5 min a task","cost":"$12 a month"},"facts":[["Model ID","gemini-3.1-pro-preview"],["Effort setting","thinking_level: \"high\""],["Harness","Gemini Enterprise for Legal"],["Runs","20 prompts x 5 runs"],["Tokens a task","250k in, 40k out, x1.5 at High effort"],["Price per 1M tokens","$2 in, $12 out"],["Graders","2 lawyers, 3 model judges"],["Judge agreement","kappa 0.72"]],"note":"Checked every citation against its source; the prose needed more editing.","sample":{"output":"The client may end the agreement under §18.2. All citations below are checked against the Research folder (3 of 3 verified).\n\n1. Right to terminate. §18.2 permits either party to terminate for convenience on 90 days' written notice. [Verified: contract p. 22]\n2. Break fee. §18.3 requires payment of 15% of the fees remaining for the Term. [Verified: contract p. 23]\n3. Enforceability. Agreed sums negotiated between sophisticated parties are generally upheld; reduction has been applied mainly where a single sum applies to any breach. [Verified: Research folder, decisions 2 and 4; summary 3]\n4. Timing. Waiting until the first anniversary avoids an argument under §18.2(b).\n5. Payment for work in progress under §18.5.\n\nRecommendation: serve notice on 1 October.","illustrative":true},"runHref":"#","efforts":[{"label":"Low","level":1,"of":3,"monthly":4.57},{"label":"Medium","level":2,"of":3,"monthly":7.62,"place":10},{"label":"High","level":3,"of":3,"monthly":12.2,"place":3}]},{"id":"memo-4","model":"Claude Fable 5.1","short":"Fable 5.1","harness":"Claude Cowork","effort":{"label":"High","level":3,"of":5},"why":"A little stronger on the hardest questions, at over twice the price.","monthly":55.0,"score":{"quality":91,"reliability":94,"speed":64.2,"cost":40.5,"ci":2.1},"measured":{"quality":"rubric 9.1 / 10 (experts 9.2, judges 8.9)","reliability":"94 of 100 runs passed","speed":"median 8.5 min a task","cost":"$55 a month"},"facts":[["Model ID","claude-fable-5-1"],["Effort setting","effort: \"high\""],["Harness","Claude Cowork"],["Runs","20 prompts x 5 runs"],["Tokens a task","250k in, 40k out, x1.5 at High effort"],["Price per 1M tokens","$10 in, $50 out"],["Graders","2 lawyers, 3 model judges"],["Judge agreement","kappa 0.70"]],"note":"Slightly deeper on the fee question; the memo ran to three pages.","sample":{"output":"MEMORANDUM - Early termination of the Seorin supply agreement\n\nAnswer: termination for convenience is available (§18.2), subject to 90 days' notice and a break fee of 15% of remaining fees (§18.3). The harder question is whether the fee could be reduced; on balance it should not be.\n\nThe contract. §18.2 is mutual and unconditional apart from notice. §18.3 fixes the fee by reference to remaining fees, with a sliding scale by year.\n\nCould the fee be reduced? Courts reduce agreed sums that are out of proportion to foreseeable loss. Three features favor enforcement here: (a) negotiation between represented parties, (b) the sliding scale, and (c) the fee's link to the supplier's committed costs, which Seorin documented during negotiation. Against enforcement: the fee applies even if Seorin re-lets the capacity quickly. This is the strongest argument Seorin would have.\n\nTiming. Notice given before the first anniversary is not prohibited, but §18.2(b)'s reference to \"the initial period\" is ambiguous; a court could read it as a minimum term. We recommend waiting until 1 October to remove the point.\n\nCosts. Break fee about KRW 189m; work in progress under §18.5, estimated at KRW 40m to 55m.\n\nNext step. Approve the draft notice attached; we will send it on 1 October.","illustrative":true},"runHref":"#","efforts":[{"label":"Low","level":1,"of":5,"monthly":24.75},{"label":"Medium","level":2,"of":5,"monthly":38.5,"place":11},{"label":"High","level":3,"of":5,"monthly":55.0,"place":4},{"label":"Extra high","level":4,"of":5,"monthly":82.5,"place":12},{"label":"Max","level":5,"of":5,"monthly":137.5}]},{"id":"memo-5","model":"GPT-6 Sol","short":"GPT-6 Sol","harness":"ChatGPT Work","effort":{"label":"Medium","level":2,"of":5},"why":"For short memos, at the lowest price here.","monthly":9.0,"score":{"quality":70,"reliability":80,"speed":100.0,"cost":100.0,"ci":2.4},"measured":{"quality":"rubric 7.0 / 10 (experts 7.2, judges 6.8)","reliability":"80 of 100 runs passed","speed":"median 3.5 min a task","cost":"$9.00 a month"},"facts":[["Model ID","gpt-6-sol"],["Effort setting","reasoning.effort: \"medium\""],["Harness","ChatGPT Work"],["Runs","20 prompts x 5 runs"],["Tokens a task","250k in, 40k out, x1.0 at Medium effort"],["Price per 1M tokens","$2 in, $10 out"],["Graders","2 lawyers, 3 model judges"],["Judge agreement","kappa 0.68"]],"note":"Fine for a short letter; not enough analysis for a memo of record.","sample":{"output":"Hi Min-ji,\n\nYou can end the agreement early under §18.2 with 90 days' notice. You will owe a break fee of 15% of the remaining fees (about KRW 189m), plus payment for work already done. The fee is likely to hold up because it was negotiated.\n\nWe suggest giving notice on 1 October to avoid an argument about timing.\n\nBest,\n[Firm]","illustrative":true},"runHref":"#","efforts":[{"label":"Instant","level":1,"of":5,"monthly":3.86,"place":13},{"label":"Medium","level":2,"of":5,"monthly":9.0,"place":5},{"label":"High","level":3,"of":5,"monthly":12.86,"place":14},{"label":"Extra High","level":4,"of":5,"monthly":19.29},{"label   const SOURCE = { name:'Redrob Leaderboard', edition:'September 2026', note:'Updated monthly' };

  const METHOD = [

    h('p', { key:3 }, 'Reliability is the share of the 100 runs that reached 7 out of 10 on the rubric. Speed and cost are scored against the best in the task on a square root, so a cheap or fast model cannot win on that alone. Weights differ by task and are shown with every score.'),
