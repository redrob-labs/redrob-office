<!-- @dsCard group="Data display" height=355 -->
<div id="root" style="padding: 24px; font-family: var(--font-sans); color: var(--ink-primary);"></div>
<script>
  const h = React.createElement;
  const R = window.Redrob;
  const row = (kids, extra) => h('div', { style: Object.assign({ display: 'flex', gap: '16px', alignItems: 'center', flexWrap: 'wrap' }, extra) }, kids);
  const col = (kids, extra) => h('div', { style: Object.assign({ display: 'flex', flexDirection: 'column', gap: '16px' }, extra) }, kids);

  function Demo() {
    return col([
      row([
        h(R.Stat, { key: 1, wash: 'brand', label: 'Applications this week', value: '1,284', delta: 12.4, period: 'vs last week', trend: [38, 41, 39, 46, 44, 52, 49, 58, 61, 57, 66, 72] }),
        h(R.Stat, { key: 2, label: 'Time to first review', value: '9.2h', delta: -18, upIsGood: false, period: 'vs last week', trend: [22, 20, 21, 18, 17, 15, 16, 13, 12, 11, 10, 9] }),
      ], { alignItems: 'stretch' }),
      row([
        h(R.Stat, { key: 3, label: 'Offer acceptance', value: '86%', period: 'Rolling 90 days' }),
        h(R.Stat, { key: 4, label: 'Open roles', value: '18', delta: 0.0, period: 'vs last month' }),
      ], { alignItems: 'stretch' }),
    ]);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
