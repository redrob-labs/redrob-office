<div id="root" style="font-family: var(--font-sans); color: var(--ink-primary);"></div>
<script>
  const h = React.createElement;
  const R = window.Redrob;
  const I = R.icons;
  const DESK = '/_blob/b3c5023586b93302b5fa11e97c5ef689';
  /* The site's one navigation (90-web.md, One navigation): the same on every page. */
  const NAV = [
    { label:'Products', items:[
      { label:'Redrob Chat',     href:'#', detail:'A conversation, with each question sent to the model that answers it best' },
      { label:'Redrob Cowork',   href:'#', detail:'The agent that works beside you, in your own files and apps' },
      { label:'Redrob Browser',  href:'#', detail:'A browser that finishes the task you give it' },
      { label:'Redrob Console',  href:'#', detail:'Where a team sees its AI: usage, spend, models and results' },
      { label:'Redrob Office',   href:'#', detail:'Documents, sheets and decks that update when a fact changes' },
      { label:'Redrob Design',   href:'#', detail:'Designs the whole product as one system, in the file' },
      { label:'Redrob Code',     href:'#', detail:'An agent that writes and fixes code in your terminal' } ] },
    { label:'Solutions', items:['For founders','For small teams','For engineers','For designers','For product managers','For marketers','For sales teams','For recruiters','For HR teams','For lawyers','For accountants','For consultants','For investors'].map(l => ({ label:l, href:'#' })) },
    { label:'Research', href:'#' },
    { label:'News', href:'#' },
    { label:'Blog', href:'#' },
    { label:'Company', href:'#' }
  ];
  /* English, Korean and Hindi first (the three markets), then the world's most spoken
     languages. Native names; Arabic sets right to left. A language with no version of this
     page renders as unavailable, never as a link home (LangSwitch). */
  const LANGS = [
    {code:'en',label:'English',href:'#'}, {code:'ko',label:'\ud55c\uad6d\uc5b4',href:'#'}, {code:'hi',label:'\u0939\u093f\u0928\u094d\u0926\u0940',href:'#'},
    {code:'zh-Hans',label:'\u7b80\u4f53\u4e2d\u6587',href:'#'}, {code:'es',label:'Espa\u00f1ol',href:'#'}, {code:'fr',label:'Fran\u00e7ais',href:'#'},
    {code:'ar',label:'\u0627\u0644\u0639\u0631\u0628\u064a\u0629',href:'#'}, {code:'bn',label:'\u09ac\u09be\u0982\u09b2\u09be',href:'#'},
    {code:'pt',label:'Portugu\u00eas',href:'#'}, {code:'ja',label:'\u65e5\u672c\u8a9e',href:'#'} ];
  const LANG = h(R.LangSwitch, { current:'en', langs: LANGS });
  /* System, Light, Dark: in the bar on every page, in the drawer on a phone. */
  const THEME = h(R.ThemeSwitch);
  const MARK_L = '/_blob/ed76761a1e006c91b7a77078f8d82da9';
  const MARK_D = '/_blob/290f8c4ecd34da668364dc8794df0e45';
  const mark = (px) => h('span', { className:'rr-mark' }, [
    h('img', { key:'l', className:'rr-mark__light', src:MARK_L, alt:'Redrob', style:{ height:px+'px' } }),
    h('img', { key:'d', className:'rr-mark__dark',  src:MARK_D, alt:'',       style:{ height:px+'px' } })
  ]);
  const HEADER = h(R.SiteHeader, { key:'hd', mark: mark(24), homeLabel:'Redrob',
    sections: NAV, lang: LANG, theme: THEME,
    action: h(R.Button, { size:'sm', shape:'pill' }, 'Start free') });
  const FOOTER = h(R.SiteFooter, { key:'ft', mark: mark(24),
    line: "The last mile of AI: the world's best models, across every border of language, place, background and technical skill.",
    columns: [
      { title:'Products', items:[
        {label:'Redrob Chat',href:'#'},{label:'Redrob Cowork',href:'#'},{label:'Redrob Browser',href:'#'},{label:'Redrob Console',href:'#'},
        {label:'Redrob Office',href:'#'},{label:'Redrob Design',href:'#'},{label:'Redrob Code',href:'#'},
        {label:'Luma, by Redrob',href:'#',divider:true,external:true},{label:'Signal, by Redrob',href:'#',external:true},{label:'Kaabil, by Redrob',href:'#',external:true},{label:'Crew, by Redrob',href:'#',external:true}] },
      { title:'Solutions', items:[{label:'For founders',href:'#'},{label:'For small teams',href:'#'},{label:'For engineers',href:'#'},{label:'For designers',href:'#'},{label:'For product managers',href:'#'},{label:'For marketers',href:'#'},{label:'For sales teams',href:'#'},{label:'For recruiters',href:'#'},{label:'For HR teams',href:'#'},{label:'For lawyers',href:'#'},{label:'For accountants',href:'#'},{label:'For consultants',href:'#'},{label:'For investors',href:'#'}] },
      { title:'Company', items:[{label:'About Redrob',href:'#'},{label:'Research',href:'#'},{label:'News',href:'#'},{label:'Blog',href:'#'}] }
    ],
    copyright: '© 2026 Redrob Inc.',
    legal: [ {label:'Privacy',href:'#'}, {label:'Terms',href:'#'}, {label:'Cookies',onClick:()=>{}}, {label:'Accessibility',href:'#'}, {label:'Company details',href:'#'} ] });

  function Screen() {
    /* One PageShell per page: the skip link, the landmarks and lang (PageShell). */
    return h(R.PageShell, { lang:'en', header: HEADER, footer: FOOTER }, [
      h(R.Band, { key: 'h', ground: 'sunken', size: 'lg' },
        h(R.StoryHeader, {
          customer: 'Northmoor', sector: 'Logistics, Rotterdam',
          claim: 'One handover pack, read the same way in four languages',
          facts: [
            { label: 'to produce a handover pack', value: '40 min', period: 'Q1 2026, against 9 hours in 2025' },
            { label: 'sites on the same pack', value: '14', period: 'since January 2026, from one site in 2025' },
            { label: 'reworked after a language check', value: '0', period: 'Q1 2026, 182 packs' }
          ]
        })),

      h(R.Band, { key: 'b', ground: 'base' },
        h(R.ArticleLayout, {
          kicker: 'Customer story', titleAs: 'h2',
          title: 'The night shift writes in Dutch and fourteen sites read it in their own language',
          standfirst: 'Northmoor runs 14 sites across six countries. The handover pack that moves a shift’s work to the next one was written once and translated three times, by hand, by whoever was still awake.',
          author: 'Jae Gardner', date: '18 September 2026', dateTime: '2026-09-18', reading: '6 min',
          contents: [
            { id: 's1', label: 'What the shift actually does' },
            { id: 's2', label: 'Where the nine hours went' },
            { id: 's3', label: 'What changed' },
            { id: 's4', label: 'What is still hard' }
          ],
          tags: [{ label: 'Redrob Office', href: '#' }, { label: 'Redrob Cowork', href: '#' }, { label: 'Logistics', href: '#' }]
        }, [

          h('h2', { key: 'h1', id: 's1' }, 'What the shift actually does'),
          h('p', { key: 'p1' }, 'At 23:00 the night shift at Rotterdam writes down what moved, what did not, and what the morning has to deal with. Fourteen sites do the same thing at their own hour. The pack is not a report anybody files. It is the thing a person reads at 06:00 before they touch a machine.'),
          h('p', { key: 'p2' }, 'Six of those sites do not work in Dutch. Until this year the pack reached them in English, translated by whoever on the night shift had the best English, which on a Tuesday was sometimes nobody.'),

          h(R.Figure, { key: 'f1', src: DESK, alt: 'The Redrob Cowork run that reads a folder of contracts, with the approval step waiting.',
            ratio: '16 / 10',
            caption: 'The same shape of run Northmoor uses: Cowork reads the folder, says what it could not read, and waits before anything leaves the building.',
            credit: 'Redrob Cowork, as designed' }),

          h('h2', { key: 'h2', id: 's2' }, 'Where the nine hours went'),
          h('p', { key: 'p3' }, 'Not in the writing. The Rotterdam pack took about 25 minutes to write. The nine hours were the four translations, the two rounds of somebody checking that the translation had not changed what a number meant, and the morning calls that happened when it had.'),

          h(R.Quote, { key: 'q', cite: 'Sanne de Vries', role: 'Head of Operations, Northmoor' },
            'We stopped translating the handover and started trusting it.'),

          h('h2', { key: 'h3', id: 's3' }, 'What changed'),
          h('p', { key: 'p4' }, 'The pack is now written once, in the language of the person writing it, and each site opens it in its own. The figures are carried across rather than retyped, which is the part that used to break.'),

          h(R.Evidence, { key: 'e',
            claim: 'Nothing was reworked after a language check in Q1 2026.',
            claimLabel: 'The claim',
            quote: 'Q1 2026: 182 packs issued across 14 sites. Language checks raised 0 corrections to a figure. Two corrections to wording, both in the Dutch original.',
            source: 'Northmoor quarterly operations review, April 2026',
            meta: 'Supplied by the customer. Redrob did not compile it.' }),

          h('h2', { key: 'h4', id: 's4' }, 'What is still hard'),
          h('p', { key: 'p5' }, 'Site-specific shorthand. Rotterdam writes "de kraan" for one particular crane and every site has a dozen words like it. Those are not translation problems and the system does not pretend to solve them; each site keeps its own list.'),

          h(R.SourceSet, { key: 'ss', title: 'What this story was checked against',
            read: 3, total: 4, unit: 'documents', updated: '18 September 2026',
            missedNote: 'The fourth is the internal incident log, which Northmoor did not share. Nothing in this story rests on it.',
            sources: [
              { name: 'Quarterly operations review, April 2026', state: 'read', count: 34, readCount: 34 },
              { name: 'Handover packs, January to March', state: 'partial', count: 182, readCount: 40,
                reason: 'A sample of 40, chosen across all 14 sites' },
              { name: 'Interview with Sanne de Vries, 2 September', state: 'read' },
              { name: 'Internal incident log', state: 'skipped', reason: 'Not shared' }
            ] })
        ])),

      h(R.Band, { key: 'm', ground: 'wash', threshold: true },
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: '28px' } }, [
          h(R.SectionMark, { key: 'm', label: 'More stories', as: 'heading', level: 2 }),
          h('div', { key: 'g', style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '28px' } }, [
            h(R.CustomerStory, { key: 1, customer: 'Seorin Construction', sector: 'Construction, Seoul',
              figure: '6 days', figureLabel: 'to close a month, from 19', period: 'FY2025, against FY2024',
              href: '#', moreLabel: 'Read the whole story' },
              'Thirty-one site offices closed their books in one place instead of eleven spreadsheets.'),
            h(R.CustomerStory, { key: 2, customer: 'Daejin Precision', sector: 'Manufacturing, Noida',
              figure: '2,400', figureLabel: 'drawings checked against the spec, from 300 checked by hand', period: 'October 2025 to March 2026, against the same months a year earlier',
              href: '#', moreLabel: 'Read the whole story' },
              'The spec is in English and the shop floor works in Hindi. Both now read the same drawing.')
          ])
        ]))
    ]);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Screen));
</script>
