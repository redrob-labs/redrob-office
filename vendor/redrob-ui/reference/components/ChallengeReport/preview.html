<div id="root" style="padding: 28px; font-family: var(--font-sans); color: var(--ink-primary);"></div>
<script>
  const h = React.createElement;
  const R = window.Redrob;
  const CHALLENGE = {
    claim: '“We can end the Seorin MSA with an email notice.”',
    sides: { for: 'Claude Opus 5.5', against: 'Gemini 3.1 Pro', judge: 'GPT-6 Sol' },
    took: '3 rounds · 1 min 50 s',
    rounds: [
      { for: 'Clause 14.5 makes any notice effective once received. Seorin reads its email, a read receipt proves arrival, and Article 111 asks only for arrival.', against: 'Clause 14.2 names the methods, and 14.3 says email "shall not by itself constitute notice". A court reads the specific clause before the general one.' },
      { for: 'Seorin accepted email for price changes twice this year without objecting, so the parties’ own practice supports email.', against: 'Amendment 2, section 3, excludes ending the agreement by name. Past price changes do not reach it.' },
      { for: 'If challenged, the worst case is that the notice counts from a later date, not that it fails.', against: 'A later date could fall after October 31, and the agreement would renew for a year. The cost of being wrong is twelve months.' }
    ],
    verdict: [
      { kind: 'broke', text: 'email alone. The Against side won rounds 2 and 3.' },
      { kind: 'held', text: 'actual receipt counts under clause 14.5, so the email copy is worth sending.' },
      { kind: 'changed', text: 'send registered mail by October 24, a week before the deadline, because a miss renews the agreement for a year.' }
    ],
    unsettled: 'whether the price-change emails count as the parties’ practice. A person should decide that.'
  };
  function Demo() {
    const [n, setN] = React.useState(CHALLENGE.rounds.length + 1);
    const [applied, setApplied] = React.useState(false);
    React.useEffect(() => { if (n > CHALLENGE.rounds.length) return; const t = setTimeout(() => setN(n + 1), 900); return () => clearTimeout(t); }, [n]);
    const running = n <= CHALLENGE.rounds.length;
    return h('div', { style: { maxWidth: '820px' } },
      h(R.ChallengeReport, Object.assign({}, CHALLENGE, { state: running ? 'running' : 'done', shown: Math.min(n, CHALLENGE.rounds.length), applied,
        onApply: () => setApplied(true), onRerun: () => { setApplied(false); setN(0); } })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
