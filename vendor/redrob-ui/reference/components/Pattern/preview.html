<!-- @dsCard group="Foundations" height=1135 page -->
<div id="root" style="font-family: var(--font-sans); color: var(--ink-primary);"></div>
<script>
  const h = React.createElement;
  const R = window.Redrob;
  const KINDS = [
    ['rake', '14px', 'The default. A ground change felt rather than seen.'],
    ['threshold', '84px', 'One stripe every six. The mark’s idea at page scale.'],
    ['weave', '14px', 'The rake and its complement. Carries a big empty panel.'],
    ['rule', 'body leading', 'Not raked, because a page is level.'],
    ['grid', '14px', 'The icon dot on a raked lattice, not a square one.'],
  ];

  function Swatch(k, boost) {
    const [name, period, note] = k;
    return h('div', { key: name + boost, style: { minWidth: 0 } }, [
      h('div', {
        key: 's',
        className: 'rr-tex rr-tex--' + name,
        style: {
          height: '132px', background: 'var(--surface-raised)',
          borderTop: '1px solid var(--border-subtle)',
          '--tex-alpha': boost ? 0.45 : null,
        },
      }),
      h('div', { key: 'n', style: { display: 'flex', justifyContent: 'space-between', gap: '8px', paddingTop: '10px' } }, [
        h('span', { key: 'a', style: { fontSize: '13px', fontWeight: 600 } }, name),
        h('span', { key: 'b', style: { fontSize: '12px', color: 'var(--ink-muted)' } }, period),
      ]),
      boost ? null : h('p', { key: 'p', style: { margin: '4px 0 0', fontSize: '12px', lineHeight: 1.5, color: 'var(--ink-muted)' } }, note),
    ]);
  }

  const grid = (boost) => h('div', {
    style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '24px', marginTop: '16px' },
  }, KINDS.map((k) => Swatch(k, boost)));

  function Demo() {
    return h('div', { style: { display: 'flex', flexDirection: 'column', gap: '36px', padding: '28px' } }, [
      h('div', { key: 'a' }, [
        h(R.SectionMark, { key: 'm', label: ['At the shipping alpha'], trailing: '5%' }),
        grid(false),
      ]),
      h('div', { key: 'b' }, [
        h(R.SectionMark, { key: 'm', label: ['At 45%, to read the geometry'], trailing: 'never ship this' }),
        grid(true),
      ]),
      h('div', { key: 'c' }, [
        h(R.SectionMark, { key: 'm', label: ['On the brand ground'] }),
        h('div', { key: 'x', className: 'rr-tex rr-tex--threshold rr-tex--coarse rr-tex--reverse',
          style: { marginTop: '16px', padding: '36px 28px', background: 'var(--gradient-deep)', color: 'var(--ink-on-brand)' } },
          h('div', { style: { fontSize: '20px', lineHeight: 1.35, maxWidth: '34ch' } },
            'The pattern is drawn in the light here, not the ink. Same rule as the icons: currentColor throughout.')),
      ]),
    ]);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
