<!-- @dsCard group="Frames" height=260 width=820 -->
<div id="root" style="font-family: var(--font-sans); color: var(--ink-primary);"></div>
<script>
  const h = React.createElement;
  const R = window.Redrob;

  /* The site's ten: the three markets first, then the most spoken languages. Two have no
     version of this page yet and show as unavailable rather than being dropped. */
  const ALL = [
    {code:'en',label:'English',href:'/products/cowork'},
    {code:'ko',label:'\ud55c\uad6d\uc5b4',href:'/ko/products/cowork'},
    {code:'hi',label:'\u0939\u093f\u0928\u094d\u0926\u0940',href:'/hi/products/cowork'},
    {code:'zh-Hans',label:'\u7b80\u4f53\u4e2d\u6587',href:'/zh/products/cowork'},
    {code:'es',label:'Espa\u00f1ol',href:'/es/products/cowork'},
    {code:'fr',label:'Fran\u00e7ais',href:'/fr/products/cowork'},
    {code:'ar',label:'\u0627\u0644\u0639\u0631\u0628\u064a\u0629',href:'/ar/products/cowork'},
    {code:'bn',label:'\u09ac\u09be\u0982\u09b2\u09be',href:'/bn/products/cowork'},
    {code:'pt',label:'Portugu\u00eas'},
    {code:'ja',label:'\u65e5\u672c\u8a9e'}
  ];

  /* It lives at the right end of a header and the menu opens leftward from there, so
     that is where the demo puts it. Shown hanging off a left margin it looks broken. */
  const bar = (node) => h('div', { style:{ display:'flex', justifyContent:'flex-end',
    padding:'10px 0', borderTop:'1px solid var(--border-subtle)' } }, node);

  function Demo() {
    return h('div', { style:{ padding:'24px 28px', display:'flex', flexDirection:'column', gap:'14px' } }, [
      h('p', { key:0, style:{ margin:0, fontSize:'12px', color:'var(--ink-secondary)' } },
        'Ten languages, so it is a menu. Every entry links to THIS page in that language; the two with no version of this page are shown as unavailable rather than quietly dropped.'),
      bar(h(R.LangSwitch, { key:1, current:'en', langs: ALL })),
      h('p', { key:2, style:{ margin:0, fontSize:'12px', color:'var(--ink-secondary)' } },
        'Two or three languages and the same component sets them inline, because a menu to choose between two things is a menu too many.'),
      bar(h(R.LangSwitch, { key:3, current:'ko',
        langs:[ {code:'en',label:'English',href:'/news/design'}, {code:'ko',label:'\ud55c\uad6d\uc5b4',href:'/ko/news/design'} ] }))
    ]);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
