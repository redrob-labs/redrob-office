<div id="root" style="padding: 28px; font-family: var(--font-sans); color: var(--ink-primary);"></div>
<script>
  const h = React.createElement;
  const R = window.Redrob;

  function Demo() {
    return h('div', { style:{ display:'flex', flexDirection:'column', gap:'28px' } }, [
      h(R.Criteria, { key:1,
        request:'Senior backend engineers in Seoul who have scaled a payments system, open to a Series B',
        items:[
          { label:'Backend engineering, seven years or more', weight:'required' },
          { label:'Has run payments at high volume', detail:'Card, wallet or settlement infrastructure above 10,000 transactions a day', weight:'required' },
          { label:'Based in Seoul or able to be', weight:'required' },
          { label:'Has worked at a company under 200 people', weight:'preferred', source:'inferred' },
          { label:'Currently at a bank', weight:'excluded', source:'inferred' }
        ],
        note:'Two of these I read into your words rather than took from them. Drop either one.',
        onRemove:()=>{}, onAdd:()=>{} })
    ]);
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
