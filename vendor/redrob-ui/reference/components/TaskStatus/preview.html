<!-- @dsCard group="Agent harness" height=270 -->
<div id="root" style="padding: 28px; font-family: var(--font-sans); color: var(--ink-primary);"></div>
<script>
  const h = React.createElement;
  const R = window.Redrob;

  function Demo() {
    const states = ['queued','running','blocked','done','failed','stopped'];
    return h('div', { style:{ display:'flex', flexDirection:'column', gap:'16px' } },
      states.map((s)=>h('div',{key:s},h(R.TaskStatus,{ state:s, elapsed: s==='running'?'2m 14s': s==='done'?'4m 02s':undefined }))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
