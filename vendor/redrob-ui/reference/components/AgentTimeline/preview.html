<div id="root" style="padding: 24px; font-family: var(--font-sans); color: var(--ink-primary);"></div>
<script>
  const h = React.createElement;
  const R = window.Redrob;
  const row = (kids, extra) => h('div', { style: Object.assign({ display: 'flex', gap: '16px', alignItems: 'center', flexWrap: 'wrap' }, extra) }, kids);
  const col = (kids, extra) => h('div', { style: Object.assign({ display: 'flex', flexDirection: 'column', gap: '16px' }, extra) }, kids);

  function Demo() {
    const steps = [
      { id: 1, state: 'done', label: 'Read the role', meta: '0.6s', detail: 'Credential check, 12 documents' },
      { id: 2, state: 'done', label: 'Read 128 source records', meta: '1.4s' },
      { id: 3, state: 'active', label: 'Drafting the equivalence summary', detail: 'Three qualifications map to the Korean framework.' },
      { id: 4, state: 'todo', label: 'Waiting for your approval to send' },
      { id: 5, state: 'todo', label: 'Add slots to the calendar' },
    ];
    return h('div', { style: { maxWidth: '520px' } }, h(R.AgentTimeline, { steps: steps }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
