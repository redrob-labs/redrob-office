<div id="root" style="padding: 24px; font-family: var(--font-sans); color: var(--ink-primary);"></div>
<script>
  const h = React.createElement;
  const R = window.Redrob;
  const I = R.icons;
  /* One pick, enough for the trigger. The full ranking is in ModelPicker. */
  const PROFESSIONS = [ { id:'lawyer', label:'Lawyer', tasks:[ { id:'draft', label:'Draft contracts', title:'Top 5 for a lawyer drafting contracts', picks:[
    { id:'draft-1', model:'Claude Opus 5.5', short:'Opus 5.5', harness:'Redrob Cowork', effort:{ label:'High', level:3, of:5 }, monthly:16.2,
      why:'Drafts from the term sheet, your templates and past deals in the folder.' } ] } ] } ];
  const picker = (k) => h(R.ModelPicker, { key: k, professions: PROFESSIONS, placement: 'top', align: 'end' });
  const label = (t) => h('div', { style: { fontSize: '12px', fontWeight: 600, color: 'var(--ink-secondary)', margin: '0 0 8px' } }, t);

  function Demo() {
    return h('div', { style: { maxWidth: '720px', display: 'flex', flexDirection: 'column', gap: '20px' } }, [
      h('div', { key: 1 }, [label('Empty: Send waits for text'),
        h(R.Composer, { key: 'c', placeholder: 'Ask Cowork to do something in this folder', tools: picker('a') })]),
      h('div', { key: 2 }, [label('Written, with the folder it will work in'),
        h(R.Composer, { key: 'c', defaultValue: 'Draft the supply agreement from the term sheet, on our standard template',
          context: h('span', { className: 'rr-composer__chip' }, [h(I.folder, { key: 'i', width: 14, height: 14 }), h('span', { key: 't' }, 'Supply agreement - Seorin')]),
          tools: picker('b') })]),
      h('div', { key: 3 }, [label('Working: Send becomes Stop'),
        h(R.Composer, { key: 'c', busy: true, placeholder: 'Cowork is drafting. Add a note for it', tools: picker('c') })])
    ]);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
