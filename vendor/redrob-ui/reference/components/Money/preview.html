<!-- @dsCard group="Local formats" height=330 width=820 -->
<div id="root" style="padding:28px; font-family: var(--font-sans); color: var(--ink-primary);"></div>
<script>
  const h = React.createElement, R = window.Redrob;
  const row = (label, node, note) => h('tr', { key: label }, [
    h('td', { key:'a', style:{ padding:'9px 22px 9px 0', fontSize:'12px', color:'var(--ink-muted)', whiteSpace:'nowrap' } }, label),
    h('td', { key:'b', style:{ padding:'9px 22px 9px 0', fontSize:'17px', fontWeight:600 } }, node),
    h('td', { key:'c', style:{ padding:'9px 0', fontSize:'12px', color:'var(--ink-secondary)' } }, note)
  ]);
  function Demo() {
    return h('table', { style:{ borderCollapse:'collapse' } }, h('tbody', null, [
      row('en-IN', h(R.Money,{ amount:28400000.5, currency:'INR', locale:'en-IN' }),
        'Grouped in lakh and crore, which is two digits after the first three'),
      row('en-US', h(R.Money,{ amount:28400000.5, currency:'USD', locale:'en-US' }), 'Grouped in thousands'),
      row('ko-KR', h(R.Money,{ amount:28400001, currency:'KRW', locale:'ko-KR' }),
        'The won has no decimal places, so none are drawn'),
      row('ko-KR, dollars', h(R.Money,{ amount:1234.5, currency:'USD', locale:'ko-KR' }),
        'US$, because a bare $ in Seoul does not say which dollar'),
      row('en-IN compact', h(R.Money,{ amount:28400000, currency:'INR', locale:'en-IN', compact:true }), 'Crore'),
      row('ko-KR compact', h(R.Money,{ amount:28400000, currency:'KRW', locale:'ko-KR', compact:true }),
        'Ten thousands, not thousands'),
      row('en-US compact', h(R.Money,{ amount:28400000, currency:'USD', locale:'en-US', compact:true }), 'Millions')
    ]));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
