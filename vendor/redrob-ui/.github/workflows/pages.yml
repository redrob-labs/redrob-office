name: pages

# Publishes the generated documentation site to GitHub Pages.
#
# Kept out of `ci.yml` on purpose: that workflow runs on pull requests and its jobs are required by
# branch protection, and a deploy must not be either of those things. A required check that deploys
# would make every pull request wait on a deployment, and a deploy that ran on a fork's pull request
# would publish a stranger's branch as the documentation.
#
# Deploys what `main` holds, because `main` is the released state: `publish.yml` refuses a tag that is
# not an ancestor of `main`, so `main` is by definition the tree someone can actually install.
#
# It deployed from `develop` first, and the site immediately said something untrue. `develop` sat at
# 1.0.1 while the registry's latest was 1.0.0, so the front page told every reader to install a version
# that does not exist - documentation describing an unreleased tree is worse than documentation that
# lags, because a reader cannot tell which one they are looking at.
#
# The cost is that the site does not move until a promotion. That is the intended behaviour: the docs
# are about the published package, not about what is in flight.
#
# Nothing here is generated by hand: the site is built from the same types, JSDoc and preview cases the
# parity gate reads.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight: an interrupted Pages deploy can leave the
# site serving a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # `yarn docs` builds the package first: the demos on the pages are rendered from `dist/`, so a
      # site built without a build would have 123 pages with nothing on them.
      - name: Build the site
        run: yarn docs

      - name: Assert the site has a page per component
        run: |
          set -euo pipefail
          pages=$(find site/components -name '*.html' | wc -l)
          demos=$(find site/demo -name '*.html' | wc -l)
          echo "component pages: $pages, rendered demos: $demos"
          [ "$pages" -ge 123 ] || { echo "::error::expected at least 123 component pages, found $pages"; exit 1; }
          [ "$demos" -ge 123 ] || { echo "::error::expected at least 123 rendered demos, found $demos"; exit 1; }
          for f in site/index.html site/llms.txt site/llms-full.txt; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty"; exit 1; }
          done

      # Whether Pages is even turned on for this repository, asked before the deploy steps rather than
      # discovered by them.
      #
      # `actions/configure-pages` fails with a bare `HttpError: Not Found` when Pages has never been
      # configured, which is this repository's state: it is private, and Pages on a private repository
      # needs a plan that allows it, so turning it on is an owner's decision about spend and visibility
      # and not something a workflow should do with `enablement: true`.
      #
      # The point of the preflight is what a red X is worth. This job failed on every push to
      # `develop` for a reason that has nothing to do with the commit, and a check that is always red
      # teaches everyone to stop reading it - at which case the next real failure is invisible too. The
      # site is still BUILT and still verified above; only the deploy is skipped, with a summary line
      # saying which setting turns it on.
      - name: Is Pages configured
        id: pages_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Pages is configured; the site will deploy."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Site built, deploy skipped"
              echo
              echo "GitHub Pages is not configured for this repository, so there is nowhere to deploy to."
              echo "The site itself built and passed its page-count check - that part is verified."
              echo
              echo "To turn it on: **Settings -> Pages -> Build and deployment -> Source: GitHub Actions**."
              echo "This repository is private, so Pages also needs a plan that permits private Pages."
              echo
              echo "Re-run this workflow afterwards and the deploy will proceed."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Pages is not configured; built the site and skipped the deploy."
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages_state.outputs.configured == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages_state.outputs.configured == 'true'
        with:
          path: site

    outputs:
      pages_configured: ${{ steps.pages_state.outputs.configured }}

  deploy:
    name: deploy to pages
    needs: build
    # Two conditions, and the second is the one that makes a manual run safe.
    #
    # Without `pages_configured` this job runs, finds no artifact, and fails - putting the red X one job
    # further along instead of removing it.
    #
    # Without the ref check, a `workflow_dispatch` on any branch would publish that branch's site as the
    # documentation. That is exactly the mistake this file just fixed: a site built from `develop` told
    # readers to install 1.0.1 while the registry's latest was 1.0.0. Building from another ref stays
    # allowed and is useful for verification; only the DEPLOY is pinned to `main`.
    if: >-
      needs.build.outputs.pages_configured == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
