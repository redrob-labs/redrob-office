id: sales/lead-qualify
version: 1
axes:
  - { id: fit, label: Product fit, range: [1, 5], guidance: "Score how well the need matches what you sell." }
  - { id: urgency, label: Urgency, range: [1, 5], guidance: "Score timeline pressure and consequences of waiting." }
  - { id: authority, label: Authority, range: [1, 5], guidance: "Score whether the contact can decide or influence the buy." }
rules:
  - { id: weak-pain, kind: model, severity: warn, prompt: "Flag missing or vague pain, impact, and success criteria." }
  - { id: unclear-buyer, kind: model, severity: warn, prompt: "Identify whether the decision maker, budget owner, and next step are clear." }
  - { id: next-step, kind: model, severity: info, prompt: "Suggest one concrete next step if the lead is worth pursuing, or say why to disqualify." }
