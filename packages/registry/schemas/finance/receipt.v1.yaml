id: finance/receipt
version: 1
locales: [en, ko, hi]
confidenceThreshold: 0.78
fields:
  - { path: /merchant, type: string, required: true }
  - { path: /transactionDate, type: string, required: true }
  - { path: /total, type: number, required: true, threshold: 0.9 }
  - { path: /currency, type: string, required: false }
  - { path: /tax, type: number, required: false }
