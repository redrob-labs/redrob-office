id: marketing/deck-pptx
version: 1
outputKind: pptx
slots:
  - { id: purpose, required: true, description: "Deck purpose (pitch, launch, webinar, etc.)" }
  - { id: audience, required: true, description: "Audience" }
  - { id: narrative, required: true, description: "Story arc; blank-line or bullet lines become slides" }
  - { id: slideCount, required: false, description: "Target slide count" }
  - { id: mustInclude, required: false, description: "Must-include slides or proof" }
