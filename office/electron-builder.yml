appId: com.redrob.office
productName: Redrob Office
copyright: Copyright © 2026 Redrob
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - build/icon.ico
  - build/icon.png
extraMetadata:
  main: out/main/index.js
forceCodeSigning: true
asar: true
asarUnpack:
  - "**/*.node"
  - "**/*.cjs"
  - "**/better-sqlite3/**"
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: Redrob-Office-Setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  license: build/license.txt
portable:
  artifactName: Redrob-Office-Portable-${version}-${arch}.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: Redrob-Office-${version}-mac-${arch}.${ext}
publish:
  provider: github
  owner: redrob-labs
  repo: redrob-office
  releaseType: release
