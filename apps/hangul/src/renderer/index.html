<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- The rhwp-studio editing surface is embedded as an iframe served from an
         app-local loopback origin (http://127.0.0.1:*), never a public CDN.
         frame-src/child-src allow only that loopback origin. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:* ws://localhost:*; frame-src http://127.0.0.1:*; child-src http://127.0.0.1:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redrob Hangul</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
