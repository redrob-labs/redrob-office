<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redrob</title>
    <style>
      /* The PDF password window, on the Redrob design system. pdf-password.ts
       * loads the kit (tokens + the rr-btn classes the buttons use) and writes
       * data-theme from the OS appearance, which the main process sets to the
       * person's theme choice. The page stays transparent for the rounded
       * window corners. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --ui-cjk: 'Microsoft YaHei', 'PingFang SC';
      }
      :root:lang(ja) {
        --ui-cjk:
          'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', 'Meiryo';
      }
      :root:lang(ko) {
        --ui-cjk: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Wanted Sans', 'Noto Sans CJK KR';
      }
      :root:lang(zh-TW) {
        --ui-cjk: 'PingFang TC', 'Microsoft JhengHei';
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: Pretendard, 'Wanted Sans', var(--ui-cjk), system-ui, sans-serif;
        color: var(--ink-primary);
        background: transparent;
        user-select: none;
        -webkit-app-region: drag;
      }
      #card {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--surface-base);
        border-radius: var(--radius-xl);
        border: 1px solid var(--border-subtle);
        padding: var(--space-6);
      }
      #title {
        font: var(--text-title-4);
        margin-bottom: var(--space-2);
      }
      #prompt {
        font: var(--text-body-sm);
        color: var(--ink-secondary);
      }
      #file {
        font-size: 12px;
        color: var(--ink-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin: 2px 0 var(--space-5);
      }
      #label {
        /* interactive (for="password"): keep clicks out of the drag region */
        -webkit-app-region: no-drag;
        display: block;
        font: var(--text-label);
        margin-bottom: 6px;
      }
      #pwd-wrap {
        position: relative;
        display: block;
      }
      #password {
        -webkit-app-region: no-drag;
        display: block;
        width: 100%;
        height: var(--control-height-md);
        padding: 0 40px 0 var(--space-3);
        font: inherit;
        font-size: 14px;
        color: var(--ink-primary);
        background: var(--surface-base);
        border: 1px solid var(--border-strong);
        border-radius: var(--field-radius);
        outline: none;
        transition:
          border-color var(--duration-fast) var(--easing-standard),
          box-shadow var(--duration-fast) var(--easing-standard);
      }
      #password:focus-visible,
      #password:focus {
        border-color: var(--focus-ring);
        box-shadow: 0 0 0 1px var(--focus-ring);
      }
      #password.invalid {
        border-color: var(--status-danger);
      }
      #password.invalid:focus {
        box-shadow: 0 0 0 1px var(--status-danger);
      }
      #password:disabled {
        background: var(--surface-sunken);
        color: var(--ink-muted);
      }
      /* wrong password: shake the field */
      #pwd-wrap.has-error {
        animation: pwd-shake 0.4s ease;
      }
      @keyframes pwd-shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-6px);
        }
        40% {
          transform: translateX(6px);
        }
        60% {
          transform: translateX(-4px);
        }
        80% {
          transform: translateX(4px);
        }
      }
      #eye {
        -webkit-app-region: no-drag;
        position: absolute;
        top: 50%;
        right: 6px;
        transform: translateY(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: none;
        border-radius: var(--radius-sm);
        background: none;
        color: var(--ink-muted);
        cursor: pointer;
      }
      #eye:hover:not(:disabled) {
        background: var(--surface-sunken);
        color: var(--ink-primary);
      }
      #eye:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #eye svg.i-eye-off {
        display: none;
      }
      #eye.showing svg.i-eye {
        display: none;
      }
      #eye.showing svg.i-eye-off {
        display: block;
      }
      #error {
        display: none;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
        font-size: 12px;
        color: var(--status-danger);
      }
      #error.visible {
        display: flex;
      }
      #error svg {
        flex-shrink: 0;
      }
      #buttons {
        margin-top: auto;
        display: flex;
        justify-content: flex-end;
        gap: var(--space-3);
      }
      #buttons .rr-btn {
        -webkit-app-region: no-drag;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div id="title"></div>
      <div id="prompt"></div>
      <div id="file"></div>
      <label id="label" for="password"></label>
      <span id="pwd-wrap">
        <input id="password" type="password" autocomplete="off" spellcheck="false" />
        <button id="eye" type="button" tabindex="-1">
          <svg
            class="i-eye"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <svg
            class="i-eye-off"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
            <path
              d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"
            />
            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
            <line x1="2" x2="22" y1="2" y2="22" />
          </svg>
        </button>
      </span>
      <span id="error" role="alert">
        <svg
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="M12 8v4" />
          <path d="M12 16h.01" />
        </svg>
        <span id="error-text"></span>
      </span>
      <div id="buttons">
        <button id="cancel" class="rr-btn rr-btn--secondary rr-btn--sm"></button>
        <button id="ok" class="rr-btn rr-btn--primary rr-btn--sm"></button>
      </div>
    </div>
    <script type="module" src="/src/pdf-password.ts"></script>
  </body>
</html>
