<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redrob Update</title>
    <style>
      /* The update window, on the Redrob design system. update.ts loads the
       * kit (tokens + the rr-btn classes the buttons below use) and writes
       * data-theme from the OS appearance, which the main process sets to the
       * person's theme choice. The page itself stays transparent so the
       * window keeps its rounded corners. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --ui-cjk: 'Microsoft YaHei', 'PingFang SC';
      }
      :root:lang(ja) {
        --ui-cjk:
          'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', 'Meiryo';
      }
      :root:lang(ko) {
        --ui-cjk: 'Apple SD Gothic Neo', 'Malgun Gothic';
      }
      :root:lang(zh-TW) {
        --ui-cjk: 'PingFang TC', 'Microsoft JhengHei';
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: Pretendard, 'Wanted Sans', var(--ui-cjk), system-ui, sans-serif;
        color: var(--ink-primary);
        background: transparent;
        user-select: none;
        -webkit-app-region: drag;
      }
      #card {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--surface-base);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border-subtle);
        overflow: hidden;
      }
      #hero {
        background: var(--gradient-deep);
        padding: var(--space-8) 0 var(--space-6);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-3);
      }
      #hero img {
        width: 64px;
        height: 64px;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
      }
      #headline {
        color: var(--ink-on-brand);
        font: var(--text-title-4);
        font-size: 18px;
      }
      #versions {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        color: var(--ink-on-brand);
        font-size: 13px;
      }
      #versions .chip {
        background: var(--surface-material);
        color: var(--ink-primary);
        border-radius: var(--radius-full);
        padding: 2px 10px;
        font-variant-numeric: tabular-nums;
      }
      #versions .chip.new {
        background: var(--surface-base);
        color: var(--ink-brand);
        font-weight: 600;
      }
      #body {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-4);
        padding: var(--space-5) var(--space-6);
      }
      #desc {
        font: var(--text-body-sm);
        color: var(--ink-secondary);
        text-align: center;
      }
      #desc.error {
        color: var(--status-danger);
      }
      #action,
      #later {
        -webkit-app-region: no-drag;
      }
      #progress {
        width: 100%;
        display: none;
        flex-direction: column;
        gap: var(--space-2);
      }
      #progress .track {
        width: 100%;
        height: 8px;
        border-radius: var(--radius-full);
        background: var(--surface-sunken);
        overflow: hidden;
      }
      #progress .bar {
        height: 100%;
        width: 0;
        border-radius: var(--radius-full);
        background: var(--action-primary);
        transition: width var(--duration-base) var(--easing-standard);
      }
      #progress .label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--ink-secondary);
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div id="hero">
        <img src="./src/assets/redrob-mark-on-dark.svg" alt="Redrob" />
        <div id="headline"></div>
        <div id="versions">
          <span class="chip" id="ver-current"></span>
          <span>→</span>
          <span class="chip new" id="ver-new"></span>
        </div>
      </div>
      <div id="body">
        <div id="desc"></div>
        <div id="progress">
          <div class="track"><div class="bar" id="bar"></div></div>
          <div class="label"><span id="progress-text"></span><span id="percent"></span></div>
        </div>
        <button id="action" class="rr-btn rr-btn--primary rr-btn--lg rr-btn--block"></button>
        <button id="later" class="rr-btn rr-btn--ghost rr-btn--sm"></button>
      </div>
    </div>
    <script type="module" src="/src/update.ts"></script>
  </body>
</html>
