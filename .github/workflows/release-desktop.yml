name: Release Redrob Office desktop apps

# Builds, signs, and publishes the Redrob Office suite shell (@genoffice/shell).
# This is the product surface (`pnpm dev`), NOT the legacy recruiting app under
# office/. Packaging uses apps/shell/electron-builder.cjs, the artifacts land in
# apps/shell/release, and the release tag must match apps/shell/package.json.
#
# The signed installer is published twice, to two audiences:
#   - the GitHub Release for the tag, with the blockmap and latest.yml the
#     in-app updater feed needs;
#   - the Redrob CDN under office/, so the Console product page can link a
#     Windows download from the same host it links every other product from.
# The Linux packages for this same tag are built and published by
# release-office-cdn.yml. The two workflows share the tag and write disjoint
# filenames, so they may run concurrently.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching apps/shell/package.json (for example v0.8.1)
        required: true
        type: string

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Sign Windows x64 (Redrob Office)
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # electron-builder's built-in Authenticode signing reads these; the shell
      # config leaves win.signtoolOptions unset unless GENOFFICE_WIN_SIGN_MODE
      # is provided, so the default CSC path applies here.
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # Generic update feed base URL baked into the shell's publish config so
      # electron-builder emits latest.yml / .blockmap for auto-update.
      GENOFFICE_UPDATE_URL: ${{ secrets.GENOFFICE_UPDATE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Require Windows signing certificate
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK) { throw "Missing WIN_CSC_LINK repository secret" }
          if (-not $env:CSC_KEY_PASSWORD) { throw "Missing WIN_CSC_KEY_PASSWORD repository secret" }

      - name: Build the suite (all editor modules + shell)
        run: pnpm build

      # NOTICE (repo root) requires build/THIRD-PARTY-NOTICES.txt to ship in the
      # installer, and electron-builder.cjs beforePack (assertThirdPartyNoticesPresent)
      # aborts packaging if it is absent. This job calls electron-builder
      # directly (not via the dist:* scripts that would run `notices`), so the
      # file must be generated explicitly here, before the package step. Runs
      # after `pnpm build` because the generator reads the built module out dirs
      # and `cargo metadata`.
      - name: Generate third-party notices
        run: pnpm --filter @genoffice/shell run notices

      - name: Sign and package Redrob Office (shell)
        run: pnpm --filter @genoffice/shell exec electron-builder --config electron-builder.cjs --win nsis --x64 --publish never

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/shell/release/*Setup*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Signed installer was not produced" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if (-not $signature.SignerCertificate) {
            throw "Installer has no Authenticode signer certificate"
          }
          # Self-signed certs are not trusted on the runner, so Status is often
          # UnknownError/NotTrusted rather than Valid. Reject only unsigned / hash failures.
          $accepted = @("Valid", "UnknownError", "NotTrusted")
          if ($accepted -notcontains $signature.Status.ToString()) {
            throw "Invalid Authenticode signature: $($signature.Status) ($($signature.StatusMessage))"
          }
          Write-Host "Signed by: $($signature.SignerCertificate.Subject) status=$($signature.Status)"

      - name: Upload signed Windows package
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows
          path: |
            apps/shell/release/*Setup*.exe
            apps/shell/release/*.blockmap
            apps/shell/release/latest.yml
          if-no-files-found: error
          compression-level: 0

  # Publishes the signed installer to the CDN, on the same two-phase contract as
  # the Linux workflow: the immutable office/<version>/ copy must be publicly
  # retrievable with a matching checksum before office/latest/ is allowed to
  # move, and only a real tag push may move it. office/latest/ carries the
  # version-free name redrob-office-x64-setup.exe, because a URL with the
  # version in it stops being the latest release as soon as the next one ships.
  cdn:
    name: Publish signed Windows installer to CDN
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      CDN_PUBLIC_HOST: cdn.redrob.ai
      CDN_PREFIX: office
      REDROB_CDN_BUCKET: ${{ vars.REDROB_CDN_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.REDROB_CDN_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.REDROB_CDN_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this run can publish
        id: guard
        run: |
          if [ -n "$REDROB_CDN_BUCKET" ] && [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "has_cdn_credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cdn_credentials=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CDN credentials are not configured (fork or unconfigured repo). Nothing will be uploaded."
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$REDROB_CDN_BUCKET" ] && [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "can_promote_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_promote_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::office/latest/ will NOT be moved (preview run, fork, or missing credentials)."
          fi

      - name: Verify tag matches application version
        run: |
          VERSION="$(node -p "require('./apps/shell/package.json').version")"
          test "$RELEASE_TAG" = "v$VERSION" || {
            echo "Tag $RELEASE_TAG does not match Redrob Office (apps/shell) version $VERSION"
            exit 1
          }
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: signed-windows
          path: signed-windows

      # Only the installer goes to the CDN. The blockmap and latest.yml are the
      # updater feed's business and stay on the GitHub Release.
      - name: Stage the installer and compute sha256 sidecars
        run: |
          set -euo pipefail
          INSTALLER="Redrob-Setup-${APP_VERSION}.exe"
          test -f "signed-windows/$INSTALLER" || {
            echo "Signed installer missing: signed-windows/$INSTALLER"
            ls -la signed-windows
            exit 1
          }
          mkdir -p cdn-staging cdn-latest
          cp "signed-windows/$INSTALLER" "cdn-staging/$INSTALLER"
          ( cd cdn-staging && sha256sum "$INSTALLER" > "$INSTALLER.sha256" )
          cp "signed-windows/$INSTALLER" cdn-latest/redrob-office-x64-setup.exe
          ( cd cdn-latest && sha256sum redrob-office-x64-setup.exe > redrob-office-x64-setup.exe.sha256 )
          ls -la cdn-staging cdn-latest

      - name: Publish immutable versioned installer
        if: steps.guard.outputs.has_cdn_credentials == 'true'
        run: |
          set -euo pipefail
          DEST="s3://${REDROB_CDN_BUCKET}/${CDN_PREFIX}/${APP_VERSION}"
          for f in cdn-staging/*; do
            name="$(basename "$f")"
            case "$name" in
              *.sha256) ctype="text/plain" ;;
              *) ctype="application/x-msdownload" ;;
            esac
            aws s3 cp "$f" "$DEST/$name" \
              --content-type "$ctype" \
              --cache-control "public, max-age=31536000, immutable" \
              --no-progress
          done

      - name: Verify public versioned CloudFront URLs
        if: steps.guard.outputs.has_cdn_credentials == 'true'
        run: |
          set -euo pipefail
          BASE="https://${CDN_PUBLIC_HOST}/${CDN_PREFIX}/${APP_VERSION}"
          for f in cdn-staging/*; do
            name="$(basename "$f")"
            curl --fail --location --silent --show-error --retry 5 --retry-delay 5 \
              --retry-all-errors -o "verify-$name" "$BASE/$name"
            local_sum="$(sha256sum "$f" | awk '{print $1}')"
            remote_sum="$(sha256sum "verify-$name" | awk '{print $1}')"
            if [ "$local_sum" != "$remote_sum" ]; then
              echo "Checksum mismatch for $name: local=$local_sum remote=$remote_sum"
              exit 1
            fi
            echo "OK $name ($remote_sum)"
          done

      - name: Promote verified installer to office/latest
        if: steps.guard.outputs.can_promote_latest == 'true'
        run: |
          set -euo pipefail
          DEST="s3://${REDROB_CDN_BUCKET}/${CDN_PREFIX}/latest"
          for f in cdn-latest/*; do
            name="$(basename "$f")"
            case "$name" in
              *.sha256) ctype="text/plain" ;;
              *) ctype="application/x-msdownload" ;;
            esac
            aws s3 cp "$f" "$DEST/$name" \
              --content-type "$ctype" \
              --cache-control "no-cache, max-age=0, must-revalidate" \
              --no-progress
          done

      - name: Verify public latest CloudFront URLs
        if: steps.guard.outputs.can_promote_latest == 'true'
        run: |
          set -euo pipefail
          BASE="https://${CDN_PUBLIC_HOST}/${CDN_PREFIX}/latest"
          for f in cdn-latest/*; do
            name="$(basename "$f")"
            curl --fail --location --silent --show-error --retry 5 --retry-delay 5 \
              --retry-all-errors -o "verify-latest-$name" "$BASE/$name"
            local_sum="$(sha256sum "$f" | awk '{print $1}')"
            remote_sum="$(sha256sum "verify-latest-$name" | awk '{print $1}')"
            if [ "$local_sum" != "$remote_sum" ]; then
              echo "Checksum mismatch for latest/$name: local=$local_sum remote=$remote_sum"
              exit 1
            fi
            echo "OK latest/$name ($remote_sum)"
          done

  release:
    name: Publish GitHub Release
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches application version
        run: |
          VERSION="$(node -p "require('./apps/shell/package.json').version")"
          test "$RELEASE_TAG" = "v$VERSION" || {
            echo "Tag $RELEASE_TAG does not match Redrob Office (apps/shell) version $VERSION"
            exit 1
          }

      - uses: actions/download-artifact@v4
        with:
          pattern: signed-*
          path: release-assets
          merge-multiple: true

      - name: Publish signed release and update metadata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
