name: Release Redrob Office

# Builds, signs and publishes the Redrob Office suite shell (@genoffice/shell) for Windows,
# macOS and Linux from one tag. This is the product surface (`pnpm dev`), NOT the legacy
# recruiting app under office/. Packaging uses apps/shell/electron-builder.cjs, the
# artifacts land in apps/shell/release, and the release tag must match apps/shell/package.json.
#
#   tag v<version> on main  ->  version  ->  windows / macos / linux  ->  publish
#
# The parts every redrob-labs repository shares are not in this file; they are called:
#   - redrob-labs/.github/actions/sign-windows            Authenticode through Azure Artifact Signing
#   - redrob-labs/.github/.github/workflows/release-publish.yml   checksums, launcher manifest, release
#
# The published GitHub Release is the single download source and the in-app updater feed:
# latest.yml, latest-mac.yml and latest-linux.yml ride along with the installers, so a
# release missing them installs fine and then never updates.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag on main to build and publish (for example v0.8.1). Ignored by a dry run.
        required: false
        type: string
        default: ""
      dry_run:
        description: Dry run -- build and sign the dispatched ref, publish nothing (no tag needed)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release is cut from main. The build jobs below check out the exact commit this job
  # resolves, never the ref a dispatch was started on, so a tag that only exists on develop
  # cannot ship under a version number main has never seen.
  #
  # This is not a style rule. v0.8.3 was dispatched with --ref develop while the tag pointed
  # at a commit on main: the build jobs did a bare checkout, so the installers were built from
  # develop and published as 0.8.3. The version and the bytes disagreed and nothing failed.
  #
  # A dry run (workflow_dispatch with dry_run) skips the tag rules: it builds and signs the
  # dispatched commit under the version apps/shell/package.json declares, and publishes nothing.
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.v.outputs.sha }}
      publish: ${{ steps.v.outputs.publish }}
      # The engine release every leg bundles as its fallback sidecar: resolved ONCE here so the
      # three platforms carry the same engine even if the engine releases while they build.
      engine: ${{ steps.engine.outputs.tag }}
    env:
      INPUT_TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        name: Resolve the tag, its commit and the version it claims
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ]; then
            VERSION="$(node -p "require('./apps/shell/package.json').version")"
            echo "dry run: building $GITHUB_SHA as $VERSION, publishing nothing"
            {
              echo "version=$VERSION"
              echo "tag=v$VERSION"
              echo "sha=$GITHUB_SHA"
              echo "publish=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            RELEASE_TAG="$INPUT_TAG"
          else
            echo "::error::not a tag push and no tag input. Pass a tag, or dry_run for a build that publishes nothing."
            exit 1
          fi
          git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null || {
            echo "::error::tag $RELEASE_TAG does not exist. Cut the tag on main first."
            exit 1
          }
          TAG_SHA="$(git rev-list -n1 "refs/tags/$RELEASE_TAG")"
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::tag $RELEASE_TAG ($TAG_SHA) is not contained in main. Promote develop to main, then tag."
            exit 1
          fi
          git checkout -q "$TAG_SHA"
          VERSION="$(node -p "require('./apps/shell/package.json').version")"
          test "$RELEASE_TAG" = "v$VERSION" || {
            echo "::error::tag $RELEASE_TAG does not match Redrob Office (apps/shell) version $VERSION at that tag"
            exit 1
          }
          echo "$RELEASE_TAG -> $TAG_SHA, contained in main, version $VERSION"
          {
            echo "version=$VERSION"
            echo "tag=$RELEASE_TAG"
            echo "sha=$TAG_SHA"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"

      - id: engine
        name: Resolve the newest Redrob Code release for the bundled sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/redrob-labs/redrob-code/releases/latest --jq .tag_name)"
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::unexpected engine tag '$tag'"; exit 1 ;; esac
          echo "bundling Redrob Code $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Redrob Code sidecar for this release: **$tag**" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    # The federated credential on the Azure app registration accepts this repository's
    # `release` environment only; the environment is otherwise plain (no reviewers, no
    # secrets of its own).
    environment: release
    permissions:
      contents: read
      # The OIDC token `azure/login` exchanges for the Artifact Signing credential.
      id-token: write
    env:
      # Windows code signing is Azure Artifact Signing, authenticated with OpenID Connect:
      # the job's GitHub token is exchanged for an Azure token against the organization's
      # app registration. No certificate file and no client secret exist anywhere. The
      # signing recipe is the organization's one copy, redrob-labs/.github
      # actions/sign-windows (checked out below at .redrob-shared): the sidecar is signed
      # by the action as a step, and electron-builder's hook (scripts/win-sign.cjs,
      # GENOFFICE_WIN_SIGN_MODE=production) runs the same sign.ps1 for every PE it
      # packages. The script reads the ARTIFACT_SIGNING_* values and SIGN_DESCRIPTION /
      # SIGN_URL / EXPECTED_CN from this environment.
      #
      # All of these are redrob-labs organization secrets, plain IDs rather than
      # credentials. A repository secret of the same name overrides the org value, so do
      # not recreate them on this repo.
      GENOFFICE_WIN_SIGN_MODE: production
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_CERT_PROFILE: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}
      SIGN_DESCRIPTION: Redrob Office
      SIGN_URL: https://github.com/${{ github.repository }}
      EXPECTED_CN: McKinley Rice, Inc.
      # Update feed target baked into the shell's publish config so electron-builder
      # emits latest.yml / .blockmap for auto-update.
      GENOFFICE_UPDATE_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Build the commit the version job resolved, never the ref a dispatch was
          # started on. A bare checkout here is what let develop's bytes ship as v0.8.3.
          ref: ${{ needs.version.outputs.sha }}

      # The shared signing recipe, for electron-builder's in-package hook.
      - uses: actions/checkout@v4
        with:
          repository: redrob-labs/.github
          path: .redrob-shared

      - name: Require the Artifact Signing configuration
        shell: pwsh
        run: |
          foreach ($name in 'AZURE_CLIENT_ID', 'ARTIFACT_SIGNING_ENDPOINT', 'ARTIFACT_SIGNING_ACCOUNT', 'ARTIFACT_SIGNING_CERT_PROFILE') {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing $name organization secret" }
          }

      # The sidecar is the engine's newest released binary (resolved once by the version job),
      # downloaded and checksum-verified by scripts/fetch-redrob-code.sh. Building it here
      # cost ~3.5 minutes per leg and bundled bytes nobody had tested.
      - name: Fetch the Redrob Code sidecar from its release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REDROB_CODE_VERSION: ${{ needs.version.outputs.engine }}
        run: bash scripts/fetch-redrob-code.sh windows-x64

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the suite (all editor modules + shell)
        run: pnpm build

      # NOTICE (repo root) requires build/THIRD-PARTY-NOTICES.txt to ship in the
      # installer, and electron-builder.cjs beforePack (assertThirdPartyNoticesPresent)
      # aborts packaging if it is absent. This job calls electron-builder directly (not
      # via the dist:* scripts that would run `notices`), so the file must be generated
      # explicitly here, before the package step. Runs after `pnpm build` because the
      # generator reads the built module out dirs and `cargo metadata`.
      - name: Generate third-party notices
        run: pnpm --filter @genoffice/shell run notices

      # The login comes AFTER the build and right BEFORE signing: GitHub's OIDC token
      # lives minutes, and a login done before the ~12-minute suite build left signtool
      # without a usable credential (it fell back to a browser prompt nobody sees and
      # the job hung). The build above is packaging-free; every signtool call happens
      # in the two steps below, within minutes of this login.
      - name: Log in to Azure (OIDC)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # electron-builder's hook signs the PEs it produces (redrob.exe, elevate.exe, the
      # uninstaller and the installer) but NOT the static extraResources: the v0.10.4 run
      # signed exactly those four and shipped redrob-code.exe as copied. The sidecar is
      # signed here, after the login and right before the package step picks it up. The
      # action verifies what it signs (signtool verify /pa, Status Valid, signer CN).
      - name: Sign the Redrob Code sidecar
        uses: redrob-labs/.github/actions/sign-windows@main
        with:
          files: apps/shell/build/redrob-code.exe
          description: ${{ env.SIGN_DESCRIPTION }}
          url: ${{ env.SIGN_URL }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          cert-profile: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}

      # nsis is the installer people download; zip is the same signed win-unpacked tree as
      # redrob-office-<v>-windows-x64-portable.zip, which is what Redrob Launcher installs
      # (it cannot run an exe installer). electron-builder signs every PE it produces
      # through the hook, which runs .redrob-shared/actions/sign-windows/sign.ps1.
      - name: Sign and package Redrob Office (shell)
        run: pnpm --filter @genoffice/shell exec electron-builder --config electron-builder.cjs --win nsis zip --x64 --publish never

      # Asset names are the launcher's <stem>-<version>-<os>-<arch>[-portable].<ext>; a
      # drift here ships a release the launcher silently cannot install.
      - name: Check release asset names
        run: node scripts/check-release-asset-names.mjs apps/shell/release

      # The shared script verified every file as it signed it. This is the one check over
      # the bytes that ship: the installer people download, and the sidecar as packaged.
      - name: Verify the shipped Authenticode signatures
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/shell/release/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Signed installer was not produced" }
          $sidecar = "apps/shell/release/win-unpacked/resources/native/redrob-code.exe"
          if (-not (Test-Path $sidecar)) { throw "Packaged Redrob Code sidecar was not produced" }
          $signtool = Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found in the Windows 10 SDK" }
          foreach ($artifact in @($installer.FullName, $sidecar)) {
            & $signtool.FullName verify /pa /v $artifact
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for ${artifact} (exit $LASTEXITCODE)" }
          }

      - name: Upload the Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            apps/shell/release/*-setup.exe
            apps/shell/release/*-portable.zip
            apps/shell/release/*.blockmap
            apps/shell/release/latest.yml
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS arm64
    needs: version
    runs-on: macos-14
    permissions:
      contents: read
    env:
      APPLE_CODESIGN_CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
      APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
      APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
      APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
      APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Fetch the Redrob Code sidecar from its release
        env:
          GH_TOKEN: ${{ github.token }}
          REDROB_CODE_VERSION: ${{ needs.version.outputs.engine }}
        run: bash scripts/fetch-redrob-code.sh darwin-arm64

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Office dependencies
        run: pnpm install --frozen-lockfile

      - name: Require Apple signing and notarization secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_CODESIGN_CERT_P12_BASE64 \
            APPLE_CODESIGN_CERT_PASSWORD \
            APPLE_NOTARY_API_KEY_P8_BASE64 \
            APPLE_NOTARY_API_KEY_ID \
            APPLE_NOTARY_API_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing macOS Office signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"
          echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build the suite and native editor sidecars
        run: pnpm build

      - name: Generate third-party notices
        run: pnpm --filter @genoffice/shell run notices

      - name: Sign, package, and notarize Redrob Office
        env:
          CSC_LINK: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ env.NOTARY_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ env.NOTARY_KEY_PATH }}
          GENOFFICE_MAC_X64: '0'
          GENOFFICE_UPDATE_REPO: ${{ github.repository }}
        run: pnpm --filter @genoffice/shell exec electron-builder --config electron-builder.cjs --mac dmg zip --arm64 --publish never

      # Same gate as the Windows job: the dmg must carry a name the launcher reads.
      - name: Check release asset names
        run: node scripts/check-release-asset-names.mjs apps/shell/release

      - name: Verify signatures and notarization tickets
        shell: bash
        run: |
          set -euo pipefail
          # Resolved by glob rather than named. This was hardcoded to "Redrob Office.app" and the
          # build produces "redrob.app", so `test -d` failed instantly with no output and the whole
          # step looked like a signature failure when signing and notarization had both succeeded.
          # A glob does not go stale the next time the product name moves.
          shopt -s nullglob
          apps=(apps/shell/release/mac-arm64/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "expected exactly one .app in apps/shell/release/mac-arm64, found ${#apps[@]}:" >&2
            printf '  %s\n' "${apps[@]}" >&2
            exit 1
          fi
          app="${apps[0]}"
          echo "verifying $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$app/Contents/Resources/native/redrob-code"
          dmgs=(apps/shell/release/*.dmg)
          zips=(apps/shell/release/*.zip)
          test "${#dmgs[@]}" -gt 0
          test "${#zips[@]}" -gt 0
          for dmg in "${dmgs[@]}"; do xcrun stapler validate "$dmg"; done

      - name: Upload the macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: |
            apps/shell/release/*.dmg
            apps/shell/release/*.zip
            apps/shell/release/*.blockmap
            apps/shell/release/latest-mac.yml
          if-no-files-found: error
          compression-level: 0

  # The unsigned Linux packages: AppImage, deb and rpm, plus latest-linux.yml, the
  # updater feed for them. Checksums are the publish job's SHA256SUMS.txt.
  linux:
    name: Linux x64
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      # Bakes the updater feed target into the app. A fork that runs this workflow
      # updates from its own releases, not from ours.
      GENOFFICE_UPDATE_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      # The shell packages a native Redrob Code binary, and electron-builder's beforePack
      # refuses to package without it (assertRedrobCodeBinaryPresent). It is the engine's
      # newest released binary (resolved once by the version job), downloaded and
      # checksum-verified by scripts/fetch-redrob-code.sh.
      - name: Fetch the Redrob Code sidecar from its release
        env:
          GH_TOKEN: ${{ github.token }}
          REDROB_CODE_VERSION: ${{ needs.version.outputs.engine }}
        run: bash scripts/fetch-redrob-code.sh linux-x64

      # rpm needs rpmbuild on the runner; electron-builder does not vendor it.
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rpm

      # The sheets xlsx sidecar is a Rust crate and the shell package step expects its
      # release binary to exist. Pinned to the stable toolchain.
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the suite (all editor modules + shell)
        run: pnpm build

      # Generates apps/shell/build/THIRD-PARTY-NOTICES.txt; beforePack aborts the
      # package if it is missing, so this must run before electron-builder.
      - name: Generate third-party notices
        run: pnpm --filter @genoffice/shell run notices

      - name: Package Linux artifacts (AppImage, deb, rpm)
        run: pnpm --filter @genoffice/shell exec electron-builder --config electron-builder.cjs --linux AppImage deb rpm --publish never

      # The filenames come straight from electron-builder.cjs (linux.artifactName /
      # deb.artifactName / rpm.artifactName); each must exist, and the feed file with them.
      - name: Check the packages
        run: |
          set -euo pipefail
          RELEASE_DIR=apps/shell/release
          for name in \
            "redrob-office-${APP_VERSION}-linux-x86_64.AppImage" \
            "redrob-office-${APP_VERSION}-linux-x86_64.deb" \
            "redrob-office-${APP_VERSION}-linux-x86_64.rpm" \
            latest-linux.yml; do
            test -f "$RELEASE_DIR/$name" || { echo "::error::expected artifact missing: $RELEASE_DIR/$name"; exit 1; }
          done
          node scripts/check-release-asset-names.mjs "$RELEASE_DIR"

      - name: Upload the Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: |
            apps/shell/release/*.AppImage
            apps/shell/release/*.deb
            apps/shell/release/*.rpm
            apps/shell/release/latest-linux.yml
          if-no-files-found: error
          compression-level: 0

  # Downloads every release-* artifact, writes SHA256SUMS.txt and redrob-launcher.json,
  # and publishes the release as latest (prerelease when the version carries a `-`).
  # Only on a real tag run, and only when every build job succeeded: a dry run stops here.
  publish:
    needs: [version, windows, macos, linux]
    if: always() && needs.version.outputs.publish == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped')
    uses: redrob-labs/.github/.github/workflows/release-publish.yml@main
    permissions:
      contents: write
    with:
      version: ${{ needs.version.outputs.version }}
      title: Redrob Office
      launcher_manifest: true
      publish: true
      tag: ${{ needs.version.outputs.tag }}
      target: ${{ needs.version.outputs.sha }}
