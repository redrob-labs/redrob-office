name: Release Redrob Office desktop apps

# Builds, signs, and publishes the Redrob Office suite shell (@genoffice/shell).
# This is the product surface (`pnpm dev`), NOT the legacy recruiting app under
# office/. Packaging uses apps/shell/electron-builder.cjs, the artifacts land in
# apps/shell/release, and the release tag must match apps/shell/package.json.
#
# The signed installers are published to the GitHub Release for the tag, together
# with the blockmap and latest.yml the in-app updater feed needs. That Release is the
# single download source: there is no CDN any more, so a link that works for a person
# and a feed that works for the updater are the same bytes in the same place.
# The Linux packages for this same tag are built and attached by release-linux.yml.
# The two workflows share the tag and write disjoint filenames, so they may run
# concurrently.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching apps/shell/package.json (for example v0.8.1)
        required: true
        type: string

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release is cut from main. The build jobs below check out the TAG, not the
  # ref a dispatch was started on, so this job is what stops a tag that only
  # exists on develop from shipping under a version number main has never seen.
  #
  # This is not a style rule. v0.8.3 was dispatched with --ref develop while the
  # tag pointed at a commit on main: the build jobs did a bare checkout, so the
  # installers were built from develop and published as 0.8.3. The version and
  # the bytes disagreed and nothing failed.
  guard:
    name: Tag is on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tag to exist and be contained in main
        run: |
          git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null || {
            echo "::error::tag $RELEASE_TAG does not exist. Cut the tag on main first."
            exit 1
          }
          TAG_SHA="$(git rev-list -n1 "refs/tags/$RELEASE_TAG")"
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::tag $RELEASE_TAG ($TAG_SHA) is not contained in main. Promote develop to main, then tag."
            exit 1
          fi
          echo "$RELEASE_TAG -> $TAG_SHA, contained in main"

      - name: Require the tag to carry the version it claims
        run: |
          git checkout -q "refs/tags/$RELEASE_TAG"
          VERSION="$(node -p "require('./apps/shell/package.json').version")"
          test "$RELEASE_TAG" = "v$VERSION" || {
            echo "::error::tag $RELEASE_TAG does not match apps/shell version $VERSION at that tag"
            exit 1
          }

  windows:
    name: Sign Windows x64 (Redrob Office)
    needs: guard
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # electron-builder's built-in Authenticode signing reads these; the shell
      # config leaves win.signtoolOptions unset unless GENOFFICE_WIN_SIGN_MODE
      # is provided, so the default CSC path applies here.
      #
      # Both names are organization secrets (redrob-labs), shared with every
      # desktop app that ships a Windows installer. A repository secret of the
      # same name overrides the org value, so do not recreate them on this repo.
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # Generic update feed base URL baked into the shell's publish config so
      # electron-builder emits latest.yml / .blockmap for auto-update.
      GENOFFICE_UPDATE_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Build the TAG, never the ref a dispatch was started on. A bare
          # checkout here is what let develop's bytes ship as v0.8.3.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Check out the Redrob Code sidecar source
        uses: actions/checkout@v4
        with:
          repository: redrob-labs/redrob-code
          ref: ${{ vars.REDROB_CODE_REF || 'main' }}
          path: redrob-code

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build the native Redrob Code sidecar
        shell: pwsh
        working-directory: redrob-code
        run: |
          bun install --frozen-lockfile
          bun run --cwd packages/redrob build --single
          $source = "packages/redrob/dist/redrob-windows-x64/bin/redrob.exe"
          if (-not (Test-Path $source)) { throw "Redrob Code Windows sidecar was not produced" }
          New-Item -ItemType Directory -Force "../apps/shell/build" | Out-Null
          Copy-Item $source "../apps/shell/build/redrob-code.exe"

      # electron-builder signs the app's own executables and the NSIS installer,
      # but NOT extraResources -- the sidecar is copied in verbatim. Sign it here,
      # before packaging, with the same certificate, so the bytes a user runs from
      # resources/native are signed and the verification step below can see it.
      - name: Sign the Redrob Code sidecar
        shell: pwsh
        run: |
          $sidecar = "apps/shell/build/redrob-code.exe"
          if (-not (Test-Path $sidecar)) { throw "Redrob Code sidecar is missing before signing: $sidecar" }
          if (-not $env:CSC_LINK) { throw "Missing WIN_CSC_LINK secret" }
          if (-not $env:CSC_KEY_PASSWORD) { throw "Missing WIN_CSC_KEY_PASSWORD secret" }

          # CSC_LINK is either base64 PKCS#12 content (how the org secret is stored)
          # or a path to a .p12/.pfx already on disk. A remote URL is not supported
          # here: fail loudly rather than package an unsigned sidecar.
          if ($env:CSC_LINK -match '^https?://') { throw "CSC_LINK is a URL; this job needs base64 or a local .p12 path" }
          if (Test-Path -LiteralPath $env:CSC_LINK) {
            $pfx = (Resolve-Path -LiteralPath $env:CSC_LINK).Path
          } else {
            $pfx = Join-Path $env:RUNNER_TEMP "redrob-office-signing.p12"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CSC_LINK))
          }

          $signtool = Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found in the Windows 10 SDK" }

          # A timestamp needs the timestamp authority to answer. Retry, then sign
          # without one rather than lose a whole build to a transient network fault.
          $signed = $false
          foreach ($attempt in 1..3) {
            & $signtool.FullName sign /f $pfx /p $env:CSC_KEY_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $sidecar
            if ($LASTEXITCODE -eq 0) { $signed = $true; break }
            Write-Host "timestamped signing attempt $attempt failed (exit $LASTEXITCODE)"
            Start-Sleep -Seconds 10
          }
          if (-not $signed) {
            & $signtool.FullName sign /f $pfx /p $env:CSC_KEY_PASSWORD /fd sha256 $sidecar
            if ($LASTEXITCODE -ne 0) { throw "signtool could not sign the Redrob Code sidecar (exit $LASTEXITCODE)" }
          }

          $signature = Get-AuthenticodeSignature $sidecar
          if (-not $signature.SignerCertificate) { throw "sidecar still has no Authenticode signer certificate after signing" }
          Write-Host "$sidecar signed by: $($signature.SignerCertificate.Subject) status=$($signature.Status)"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Require Windows signing certificate
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK) { throw "Missing WIN_CSC_LINK repository secret" }
          if (-not $env:CSC_KEY_PASSWORD) { throw "Missing WIN_CSC_KEY_PASSWORD repository secret" }

      - name: Build the suite (all editor modules + shell)
        run: pnpm build

      # NOTICE (repo root) requires build/THIRD-PARTY-NOTICES.txt to ship in the
      # installer, and electron-builder.cjs beforePack (assertThirdPartyNoticesPresent)
      # aborts packaging if it is absent. This job calls electron-builder
      # directly (not via the dist:* scripts that would run `notices`), so the
      # file must be generated explicitly here, before the package step. Runs
      # after `pnpm build` because the generator reads the built module out dirs
      # and `cargo metadata`.
      - name: Generate third-party notices
        run: pnpm --filter @genoffice/shell run notices

      - name: Sign and package Redrob Office (shell)
        run: pnpm --filter @genoffice/shell exec electron-builder --config electron-builder.cjs --win nsis --x64 --publish never

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/shell/release/*Setup*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Signed installer was not produced" }
          $sidecar = "apps/shell/release/win-unpacked/resources/native/redrob-code.exe"
          if (-not (Test-Path $sidecar)) { throw "Packaged Redrob Code sidecar was not produced" }
          # Self-signed certs are not trusted on the runner, so Status is often
          # UnknownError/NotTrusted rather than Valid. Reject only unsigned / hash failures.
          $accepted = @("Valid", "UnknownError", "NotTrusted")
          foreach ($artifact in @($installer.FullName, $sidecar)) {
            $signature = Get-AuthenticodeSignature $artifact
            if (-not $signature.SignerCertificate) {
              throw "$artifact has no Authenticode signer certificate"
            }
            if ($accepted -notcontains $signature.Status.ToString()) {
              throw "Invalid Authenticode signature for ${artifact}: $($signature.Status) ($($signature.StatusMessage))"
            }
            Write-Host "$artifact signed by: $($signature.SignerCertificate.Subject) status=$($signature.Status)"
          }

      - name: Upload signed Windows package
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows
          path: |
            apps/shell/release/*Setup*.exe
            apps/shell/release/*.blockmap
            apps/shell/release/latest.yml
          if-no-files-found: error
          compression-level: 0

  macos:
    name: Sign and notarize macOS arm64 (Redrob Office)
    needs: guard
    runs-on: macos-14
    permissions:
      contents: read
    env:
      APPLE_CODESIGN_CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
      APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
      APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
      APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
      APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Build the TAG, never the ref a dispatch was started on. A bare
          # checkout here is what let develop's bytes ship as v0.8.3.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Check out the Redrob Code sidecar source
        uses: actions/checkout@v4
        with:
          repository: redrob-labs/redrob-code
          ref: ${{ vars.REDROB_CODE_REF || 'main' }}
          path: redrob-code

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build the native Redrob Code sidecar
        working-directory: redrob-code
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run --cwd packages/redrob build --single
          test -x packages/redrob/dist/redrob-darwin-arm64/bin/redrob
          mkdir -p ../apps/shell/build
          cp packages/redrob/dist/redrob-darwin-arm64/bin/redrob ../apps/shell/build/redrob-code
          chmod 755 ../apps/shell/build/redrob-code

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Office dependencies
        run: pnpm install --frozen-lockfile

      - name: Require Apple signing and notarization secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_CODESIGN_CERT_P12_BASE64 \
            APPLE_CODESIGN_CERT_PASSWORD \
            APPLE_NOTARY_API_KEY_P8_BASE64 \
            APPLE_NOTARY_API_KEY_ID \
            APPLE_NOTARY_API_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing macOS Office signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"
          echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build the suite and native editor sidecars
        run: pnpm build

      - name: Generate third-party notices
        run: pnpm --filter @genoffice/shell run notices

      - name: Sign, package, and notarize Redrob Office
        env:
          CSC_LINK: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ env.NOTARY_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ env.NOTARY_KEY_PATH }}
          GENOFFICE_MAC_X64: '0'
          GENOFFICE_UPDATE_REPO: ${{ github.repository }}
        run: pnpm --filter @genoffice/shell exec electron-builder --config electron-builder.cjs --mac dmg zip --arm64 --publish never

      - name: Verify signatures and notarization tickets
        shell: bash
        run: |
          set -euo pipefail
          # Resolved by glob rather than named. This was hardcoded to "Redrob Office.app" and the
          # build produces "redrob.app", so `test -d` failed instantly with no output and the whole
          # step looked like a signature failure when signing and notarization had both succeeded.
          # A glob does not go stale the next time the product name moves.
          shopt -s nullglob
          apps=(apps/shell/release/mac-arm64/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "expected exactly one .app in apps/shell/release/mac-arm64, found ${#apps[@]}:" >&2
            printf '  %s\n' "${apps[@]}" >&2
            exit 1
          fi
          app="${apps[0]}"
          echo "verifying $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$app/Contents/Resources/native/redrob-code"
          dmgs=(apps/shell/release/*.dmg)
          zips=(apps/shell/release/*.zip)
          test "${#dmgs[@]}" -gt 0
          test "${#zips[@]}" -gt 0
          for dmg in "${dmgs[@]}"; do xcrun stapler validate "$dmg"; done

      - name: Upload signed macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: signed-macos
          path: |
            apps/shell/release/*.dmg
            apps/shell/release/*.zip
            apps/shell/release/latest-mac.yml
          if-no-files-found: error
          compression-level: 0

  # Attaches every signed artifact to the Release for the tag, including latest.yml
  # and latest-mac.yml. Those two files ARE the updater feed under the GitHub
  # provider, so a release missing them installs fine and then never updates.
  release:
    name: Publish GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Build the TAG, never the ref a dispatch was started on. A bare
          # checkout here is what let develop's bytes ship as v0.8.3.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Verify tag matches application version
        run: |
          VERSION="$(node -p "require('./apps/shell/package.json').version")"
          test "$RELEASE_TAG" = "v$VERSION" || {
            echo "Tag $RELEASE_TAG does not match Redrob Office (apps/shell) version $VERSION"
            exit 1
          }

      - uses: actions/download-artifact@v4
        with:
          pattern: signed-*
          path: release-assets
          merge-multiple: true

      - name: Publish signed release and update metadata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
