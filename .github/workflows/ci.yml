name: CI

# Pull requests run ONE fast path: install, the seconds-long repo checks, typecheck and the
# fast package unit tests. Everything slow -- the full build, every app suite, the sheets
# Rust engine, the Hangul-core rebuild, Windows and macOS -- is a manual run
# (workflow_dispatch). A push to main is a merge of a pull request that already ran here,
# and the release workflow builds the tag itself.
on:
  pull_request:
    # A pull request into main only promotes commits that already passed here on develop.
    branches-ignore: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # heavy=false when the pull request only touches docs or only bumps version strings.
  # The heavy job is then skipped, and a skipped job still satisfies its required check.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull_request checkout is the merge commit; its first parent is the base tip.
          fetch-depth: 2

      - name: Docs-only or version-only?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          heavy=false
          # Lines of a -U0 diff that are not a version string change.
          not_version() {
            git diff -U0 HEAD^1 HEAD -- "$1" \
              | grep -vE '^(diff --git|index |--- |\+\+\+ |@@ )' \
              | grep -vE "$2" || true
          }
          while IFS= read -r -d '' f; do
            base="${f##*/}"
            case "$f" in
              *.md|docs/*|LICENSE*|CHANGELOG*) continue ;;
            esac
            case "$base" in
              VERSION|REDROB_VERSION|*-version.txt) continue ;;
              package.json)
                [ -z "$(not_version "$f" '^[+-][[:space:]]*"version":[[:space:]]*"[^"]*",?[[:space:]]*$')" ] && continue ;;
              Cargo.toml|Cargo.lock)
                [ -z "$(not_version "$f" '^[+-]version = "[^"]*"[[:space:]]*$')" ] && continue ;;
            esac
            echo "heavy: $f"
            heavy=true
            break
          done < <(git diff -z --name-only HEAD^1 HEAD)
          echo "heavy=$heavy" | tee -a "$GITHUB_OUTPUT"

  boundary:
    name: fork boundary & licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Reads upstream-base.json and the licence notices; nothing installed, seconds long.
      - name: Fork boundary
        run: node scripts/check-upstream-boundary.mjs

  # The required check. Name kept exactly: branch protection on develop requires it.
  build-test-linux:
    name: build & test (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dependency licences
        run: pnpm check:licenses

      - name: Design-system tokens
        run: pnpm check:ui-tokens

      - name: English copy
        run: pnpm check:copy

      # --only: typecheck every package without first building its dependencies. No
      # source imports another app's build output, and the ^build step is what pulled
      # in the electron-vite builds and the two-minute sheets cargo build.
      - name: Typecheck
        run: pnpm exec turbo run typecheck --only

      # The fast package suites (seconds each). App suites, the engine suites and the
      # Hangul harnesses run in `full build & test` on a manual run.
      - name: Fast unit tests
        run: >-
          pnpm exec turbo run test --only
          --filter=@genoffice/agent-core
          --filter=@genoffice/ai-provider
          --filter=@genoffice/ai-search
          --filter=@genoffice/electron-utils
          --filter=@genoffice/facts
          --filter=@genoffice/file-parse
          --filter=@genoffice/font-metrics
          --filter=@genoffice/hwp-core
          --filter=@genoffice/i18n
          --filter=@genoffice/identity
          --filter=@genoffice/project-store
          --filter=@genoffice/sync-client
          --filter=@genoffice/versions
          --filter=@rhwp/editor

  # Manual run only: the full build, the preload check and every suite, on all three OSes.
  full:
    name: full build & test (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # @genoffice/sheets builds a native Rust xlsx-engine (cargo) during `pnpm build`.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # A sandboxed preload that requires a workspace package throws at load and
      # the editor opens blank; nothing else notices.
      - name: Preload bundles
        run: pnpm check:preload

      - name: Test
        run: pnpm test

  # Manual run only (about ten minutes). The fast check compares the committed wasm and
  # engine source with provenance.json; the rebuild proves the committed wasm really
  # comes from the committed source.
  hwp-core:
    name: hwp-core reproducible
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Provenance matches the committed files
        run: node scripts/hwp-core-provenance.mjs --check

      - name: Rust toolchain (engines/rhwp/rust-toolchain.toml)
        working-directory: engines/rhwp
        run: rustup show active-toolchain || rustup toolchain install

      - name: wasm-pack and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0,cargo-deny@0.18.9

      - name: Rust dependency licences and sources
        working-directory: engines/rhwp
        run: cargo-deny --locked check licenses sources

      - name: Rebuild the wasm from source
        run: sh scripts/build-hwp-core.sh

      - name: Rebuilt bytes match provenance.json
        run: node scripts/hwp-core-provenance.mjs --check
